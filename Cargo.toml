[package]
name = "airlock"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
regex = "1.12.4"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
uuid = { version = "1.23.3", features = ["v4"] }
zeroize = "1.9.0"

[dev-dependencies]
proptest = "1.11.0"
tokio = { version = "1.52.3", features = ["test-util"] }
