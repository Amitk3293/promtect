[package]
name = "promtect"
version = "0.1.13"
edition = "2024"
description = "Local-first privacy proxy for AI coding tools: masks secrets out of outbound LLM requests and restores them in the response. No cloud, no root CA."
license = "Apache-2.0"
repository = "https://github.com/amitk3293/promtect"
homepage = "https://promtect.org"
readme = "README.md"
keywords = ["security", "secrets", "proxy", "llm", "privacy"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
axum = "0.8.9"
bytes = "1.12.0"
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
rand = "0.9"
regex = "1.12.4"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
uuid = { version = "1.23.3", features = ["v4"] }
zeroize = "1.9.0"

[dev-dependencies]
proptest = "1.11.0"
tokio = { version = "1.52.3", features = ["test-util"] }
