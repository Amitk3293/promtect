# Dockerized test harness (Pro buildout #1b).
#
# WHY: the project mandates Docker-only build/test (nothing on the host), and
# GitHub Actions is at its CI limit this week, so this compose file is the gate:
#   make docker-test        # fmt --check + clippy -D warnings + cargo test
#
# Caching: the cargo registry and the build target dir are named volumes, so
# repeat runs are incremental. The volume at /usr/local/cargo/registry only
# shadows the registry cache, NOT the toolchain binaries under
# /usr/local/cargo/bin, so cargo/rustc stay available.
services:
  test:
    # Pin the multi-architecture image: the mutable `rust:1-bookworm` tag
    # stopped including Clippy/rustfmt in July 2026 and broke this clean-clone
    # gate before it could run any repository checks.
    image: rust:1.96.0-bookworm@sha256:5e2214abe154fe26e39f64488952e5c991eeed1d6d6da7cc8381ae83927f0cfc
    working_dir: /build
    volumes:
      - .:/build
      - promtect-cargo-registry:/usr/local/cargo/registry
      - promtect-cargo-target:/build/target
    environment:
      CARGO_TERM_COLOR: "always"
    # NOTE: `bash -c`, NOT `bash -lc` — a login shell resets PATH and drops the
    # image's /usr/local/cargo/bin, which makes `cargo` "command not found".
    command: >
      bash -c "rustup component add rustfmt clippy && cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test"

volumes:
  promtect-cargo-registry:
  promtect-cargo-target:
