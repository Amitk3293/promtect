name: CI

# Third-party actions are pinned to immutable commit SHAs (not mutable tags like
# @v4) so a compromised or retagged release cannot silently run in CI. The
# trailing comment records the human-readable version each SHA corresponds to;
# bump both together when updating.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Build and test on both Linux and macOS so the proxy, smoke script, and
    # platform-specific code (e.g. the port-conflict helper) stay green on the two
    # platforms developers actually run Promtect on.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Smoke test
        run: bash scripts/smoke.sh

  audit:
    runs-on: ubuntu-latest
    # Fails the build on any dependency with a known security advisory (RUSTSEC).
    # A security proxy must never ship a vulnerable dependency.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: taiki-e/install-action@91534edaf9fd796a162759d80d49cdff574bff2c # cargo-audit
        with:
          tool: cargo-audit
      - name: Audit dependencies
        run: cargo audit --deny warnings

  dashboard-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Docker dashboard browser suite
        run: make dashboard-browser-test

  coverage:
    runs-on: ubuntu-latest
    # Report-only: prints the coverage summary on every run; never fails the build.
    # continue-on-error ensures a cargo-llvm-cov install or invocation failure
    # does not block merges — coverage is a visibility tool, not a gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@91534edaf9fd796a162759d80d49cdff574bff2c # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov
      - name: Coverage summary (report-only)
        run: cargo llvm-cov --workspace --summary-only
