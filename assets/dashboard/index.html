<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promtect — Dashboard</title>
<!--
  Promtect dashboard — one self-contained file. ALL CSS and JS are inline.
  ZERO external network: no CDN, no framework, no web fonts, no telemetry.
  Promtect guards your secrets, so the dashboard that watches it must never
  phone home. It reads ONLY the value-free GET /api/metrics feed (counts,
  detector kind names, byte totals) and NEVER a secret value or body content.

  Aesthetic: dark technical minimalist. Near-black canvas, white type, a single
  teal accent, mono uppercase micro-labels, numbered cards. The signature motif
  is a live mask -> restore pipeline at the top with sync-pulse badges. Every
  animation is CSS-only and CSP-safe; all motion honours prefers-reduced-motion.

  The page polls /api/metrics every 4s and rebuilds the same value-free model the
  previous version used (buildModel), so the JSON shape and endpoint are unchanged.
-->
<style>
  /* ============================================================
     TOKENS — type, scale, weights, tracking
     Offline substitution for Geist / Geist Mono via native stacks.
     ============================================================ */
  :root {
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "Geist", system-ui, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", "Geist Mono", Menlo, Consolas, monospace;

    --text-2xs:  11px;
    --text-xs:   12px;
    --text-sm:   13px;
    --text-base: 15px;
    --text-md:   17px;
    --text-lg:   20px;
    --text-xl:   26px;
    --text-2xl:  34px;
    --text-3xl:  52px;
    --text-4xl:  68px;

    --weight-regular:  400;
    --weight-medium:   500;
    --weight-semibold: 600;
    --weight-bold:     700;

    --leading-tight:   1.08;
    --leading-snug:    1.3;
    --leading-normal:  1.5;
    --leading-relaxed: 1.65;

    --tracking-tight: -0.02em;
    --tracking-snug:  -0.01em;
    --tracking-caps:   0.14em;
  }

  /* ============================================================
     TOKENS — color ramps (cool graphite ink + accent families)
     ============================================================ */
  :root {
    --ink-950: #07090c;
    --ink-925: #0a0d11;
    --ink-900: #0e1217;
    --ink-850: #12171e;
    --ink-800: #181f28;
    --ink-750: #1e2630;
    --ink-700: #28323e;
    --ink-600: #364350;
    --ink-500: #4a5a6a;
    --ink-400: #6b7b8b;
    --ink-300: #93a2b1;
    --ink-200: #bcc7d1;
    --ink-100: #dde4ea;
    --ink-50:  #eef2f5;
    --white:   #ffffff;

    /* Seal (primary accent) — sealed-chamber teal */
    --seal-300: #54d8c8;
    --seal-400: #25c2b1;
    --seal-500: #12b5a6;
    --seal-600: #0c9387;
    --seal-700: #0c756c;

    /* Caught (amber) — a secret was detected and masked */
    --caught-300: #f4c060;
    --caught-400: #efa838;
    --caught-500: #e2901e;

    /* Clear (green) — clean traffic */
    --clear-300: #6fcf97;
    --clear-400: #43b87a;
    --clear-500: #2ba566;

    /* Leak (red) — danger / offline */
    --leak-300: #f0917f;
    --leak-400: #ea6850;
    --leak-500: #df4a31;

    /* Pro (violet) — paid-class detectors */
    --pro-300: #b69cff;
    --pro-400: #9a78f0;
    --pro-500: #8159e6;
  }

  /* Dark theme — the only product surface here */
  [data-theme="dark"] {
    --bg-canvas:      var(--ink-950);
    --bg-sunken:      var(--ink-925);
    --surface-card:   var(--ink-900);
    --surface-raised: var(--ink-850);
    --surface-inset:  var(--ink-925);
    --surface-code:   #06080b;

    --border-subtle:  color-mix(in oklab, var(--ink-700) 55%, transparent);
    --border-default: var(--ink-700);
    --border-strong:  var(--ink-600);

    --text-strong:    var(--ink-50);
    --text-body:      var(--ink-200);
    --text-muted:     var(--ink-400);
    --text-faint:     var(--ink-500);
    --text-on-accent: var(--ink-950);

    --accent:         var(--seal-400);
    --accent-hover:   var(--seal-300);
    --accent-soft:    color-mix(in oklab, var(--seal-500) 16%, transparent);
    --accent-border:  color-mix(in oklab, var(--seal-500) 40%, transparent);

    --caught:         var(--caught-400);
    --caught-soft:    color-mix(in oklab, var(--caught-500) 15%, transparent);
    --caught-border:  color-mix(in oklab, var(--caught-500) 38%, transparent);

    --clear:          var(--clear-400);
    --clear-soft:     color-mix(in oklab, var(--clear-500) 15%, transparent);
    --clear-border:   color-mix(in oklab, var(--clear-500) 38%, transparent);

    --leak:           var(--leak-400);
    --leak-soft:      color-mix(in oklab, var(--leak-500) 16%, transparent);
    --leak-border:    color-mix(in oklab, var(--leak-500) 40%, transparent);

    --pro:            var(--pro-300);
    --pro-soft:       color-mix(in oklab, var(--pro-500) 18%, transparent);
    --pro-border:     color-mix(in oklab, var(--pro-500) 42%, transparent);

    --focus-ring:     var(--seal-400);
  }

  /* ============================================================
     TOKENS — spacing, radii, layout, motion
     ============================================================ */
  :root {
    --space-1:  0.25rem;
    --space-2:  0.5rem;
    --space-3:  0.75rem;
    --space-4:  1rem;
    --space-5:  1.25rem;
    --space-6:  1.5rem;
    --space-8:  2rem;
    --space-10: 2.5rem;
    --space-12: 3rem;
    --space-16: 4rem;

    --radius-xs:   3px;
    --radius-sm:   5px;
    --radius-md:   8px;
    --radius-lg:   12px;
    --radius-xl:   16px;
    --radius-pill: 999px;

    --hairline: 1px;

    --ease-out:   cubic-bezier(0.22, 0.61, 0.36, 1);
    --ease-inout: cubic-bezier(0.45, 0, 0.2, 1);
    --dur-fast:   120ms;
    --dur-base:   200ms;
    --dur-slow:   320ms;

    --ring: 0 0 0 3px color-mix(in oklab, var(--focus-ring) 38%, transparent);
    --glow-accent: 0 0 0 1px var(--accent-border), 0 0 28px -8px var(--seal-500);
  }

  /* ============================================================
     BASE
     ============================================================ */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: var(--text-base);
    line-height: var(--leading-normal);
    color: var(--text-body);
    background: var(--bg-canvas);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-feature-settings: 'cv01', 'ss01';
    /* Atmospheric backdrop: a faint accent glow top-left + a fine grid. No images,
       no requests — pure CSS gradients painted once, fixed to the viewport. */
    background-image:
      radial-gradient(820px 520px at 12% -8%, color-mix(in oklab, var(--seal-500) 12%, transparent), transparent 70%),
      radial-gradient(680px 480px at 100% 0%, color-mix(in oklab, var(--pro-500) 8%, transparent), transparent 72%),
      linear-gradient(transparent calc(100% - 1px), color-mix(in oklab, var(--ink-700) 22%, transparent) 100%),
      linear-gradient(90deg, transparent calc(100% - 1px), color-mix(in oklab, var(--ink-700) 22%, transparent) 100%);
    background-size: 100% 100%, 100% 100%, 64px 64px, 64px 64px;
    background-attachment: fixed;
  }
  h1, h2, h3, h4 {
    margin: 0;
    color: var(--text-strong);
    font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight);
    line-height: var(--leading-tight);
    text-wrap: balance;
  }
  p { margin: 0; text-wrap: pretty; }
  a { color: var(--accent); text-decoration: none; transition: color var(--dur-fast) var(--ease-out); }
  a:hover { color: var(--accent-hover); }
  code, pre, kbd, samp { font-family: var(--font-mono); font-size: 0.92em; }
  ::selection { background: color-mix(in oklab, var(--seal-500) 30%, transparent); }
  :focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; border-radius: var(--radius-sm); }

  /* --- Text helpers --- */
  .al-eyebrow {
    font-family: var(--font-mono);
    font-size: var(--text-2xs);
    letter-spacing: var(--tracking-caps);
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: var(--weight-medium);
  }
  .al-mono { font-family: var(--font-mono); }
  .al-tabular { font-variant-numeric: tabular-nums; }
  .al-faint { color: var(--text-faint); }
  .al-right { text-align: right; }

  /* ============================================================
     PRIMITIVES — badge, detector chip, card, metric, tabs, button
     ============================================================ */

  /* ---- Sync-pulse badge: a dot that breathes in time across the row ---- */
  .al-badge {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: var(--font-mono); font-size: var(--text-2xs);
    letter-spacing: var(--tracking-caps); text-transform: uppercase;
    font-weight: var(--weight-medium); line-height: 1;
    padding: 5px 10px; border-radius: var(--radius-pill);
    border: 1px solid transparent; white-space: nowrap;
  }
  .al-badge__dot {
    width: 6px; height: 6px; border-radius: 50%; background: currentColor;
    box-shadow: 0 0 0 0 currentColor;
    animation: al-sync 2200ms var(--ease-inout) infinite;
  }
  /* Sync-pulse: shared keyframe + shared duration => every dot pulses together. */
  @keyframes al-sync {
    0%, 100% { box-shadow: 0 0 0 0 color-mix(in oklab, currentColor 70%, transparent); opacity: 1; }
    50%      { box-shadow: 0 0 0 5px color-mix(in oklab, currentColor 0%, transparent); opacity: 0.55; }
  }
  .al-badge--neutral { background: var(--surface-inset); color: var(--text-muted); border-color: var(--border-subtle); }
  .al-badge--caught  { background: var(--caught-soft); color: var(--caught); border-color: var(--caught-border); }
  .al-badge--clear   { background: var(--clear-soft);  color: var(--clear);  border-color: var(--clear-border); }
  .al-badge--leak    { background: var(--leak-soft);   color: var(--leak);   border-color: var(--leak-border); }
  .al-badge--accent  { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-border); }
  .al-badge--pro     { background: var(--pro-soft);    color: var(--pro);    border-color: var(--pro-border); }
  /* A static (non-pulsing) variant for labels that aren't a live signal. */
  .al-badge--static .al-badge__dot { animation: none; box-shadow: none; }

  /* ---- Detector chip (mono token) ---- */
  .al-detector {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--font-mono); font-size: var(--text-xs);
    font-weight: var(--weight-medium);
    padding: 3px 9px; border-radius: var(--radius-sm);
    background: var(--surface-inset); color: var(--text-body);
    border: 1px solid var(--border-subtle);
  }
  .al-detector__mark { width: 7px; height: 7px; border-radius: 2px; background: var(--caught-400); flex: none; }
  .al-detector--pro { color: var(--pro); border-color: var(--pro-border); }
  .al-detector--pro .al-detector__mark { background: var(--pro-400); }

  /* ---- Card: numbered, hairline, hover-lift ---- */
  .al-card {
    position: relative;
    background:
      linear-gradient(180deg, color-mix(in oklab, var(--white) 2%, transparent), transparent 42%),
      var(--surface-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    transition: border-color var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out);
  }
  .al-card--pad { padding: var(--space-5); }
  .al-card[data-index]::before {
    content: attr(data-index);
    position: absolute; top: 14px; right: 16px;
    font-family: var(--font-mono); font-size: var(--text-2xs);
    letter-spacing: var(--tracking-caps); color: var(--text-faint);
    font-weight: var(--weight-medium);
  }
  .al-card:hover { border-color: var(--border-strong); }

  /* ---- Metric stat ---- */
  .al-metric { display: flex; flex-direction: column; gap: 10px; }
  .al-metric__label {
    font-family: var(--font-mono); font-size: var(--text-2xs);
    letter-spacing: var(--tracking-caps); text-transform: uppercase;
    color: var(--text-muted);
  }
  .al-metric__value {
    font-family: var(--font-mono); font-variant-numeric: tabular-nums;
    font-weight: var(--weight-medium); letter-spacing: -0.02em;
    color: var(--text-strong); line-height: 1; font-size: var(--text-3xl);
  }
  .al-metric__foot { display: flex; align-items: center; gap: 6px; font-size: var(--text-xs); color: var(--text-muted); }
  .al-metric--caught .al-metric__value { color: var(--caught); }
  .al-metric--clear  .al-metric__value { color: var(--clear); }
  .al-metric--accent .al-metric__value { color: var(--accent); }

  /* ---- Tabs ---- */
  .al-tabs { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface-inset); border-radius: var(--radius-md); border: 1px solid var(--border-subtle); }
  .al-tab {
    font-family: var(--font-mono); font-size: var(--text-2xs); font-weight: var(--weight-medium);
    letter-spacing: var(--tracking-caps); text-transform: uppercase;
    color: var(--text-muted); background: transparent; border: none; cursor: pointer;
    padding: 7px 13px; border-radius: var(--radius-sm);
    transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
  }
  .al-tab:hover { color: var(--text-strong); }
  .al-tab--active { background: var(--surface-raised); color: var(--text-strong); }
  .al-tab:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

  /* ---- Icon button ---- */
  .al-iconbtn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 38px; height: 38px;
    background: transparent; color: var(--text-muted);
    border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
    cursor: pointer; padding: 0;
    transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
  }
  .al-iconbtn:hover { background: var(--surface-inset); color: var(--text-strong); border-color: var(--border-strong); }
  .al-iconbtn:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .al-iconbtn svg { width: 18px; height: 18px; }
  .al-iconbtn.is-spinning svg { animation: al-spin 600ms var(--ease-out); }
  @keyframes al-spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }

  /* ============================================================
     SHELL — top bar + page
     ============================================================ */
  .al-app { min-height: 100vh; }

  .al-topbar {
    display: flex; align-items: center; gap: var(--space-6);
    height: 62px; padding: 0 var(--space-8);
    border-bottom: 1px solid var(--border-subtle);
    background: color-mix(in oklab, var(--bg-sunken) 82%, transparent);
    backdrop-filter: blur(10px);
    position: sticky; top: 0; z-index: 20;
  }
  .al-topbar__brand { display: flex; align-items: center; gap: var(--space-4); }
  .al-topbar__sep { width: 1px; height: 22px; background: var(--border-default); }
  .al-topbar__title {
    font-family: var(--font-mono); font-size: var(--text-2xs);
    letter-spacing: var(--tracking-caps); text-transform: uppercase;
    color: var(--text-muted);
  }
  .al-topbar__status { display: flex; align-items: center; gap: var(--space-2); }
  .al-topbar__actions { display: flex; align-items: center; gap: var(--space-3); margin-left: auto; }

  .al-page { max-width: 1240px; margin: 0 auto; padding: var(--space-12) var(--space-8) var(--space-16); }

  /* Staggered entrance for top-level sections. Disabled under reduced-motion. */
  .al-rise { opacity: 0; transform: translateY(10px); animation: al-rise 560ms var(--ease-out) forwards; }
  @keyframes al-rise { to { opacity: 1; transform: none; } }

  /* ---- Page head ---- */
  .al-page__head { margin-bottom: var(--space-10); max-width: 70ch; }
  .al-page__kicker { margin-bottom: var(--space-4); }
  .al-page__h1 {
    font-size: var(--text-2xl); font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight);
  }
  .al-page__sub { font-size: var(--text-sm); color: var(--text-muted); margin-top: var(--space-3); max-width: 62ch; line-height: var(--leading-relaxed); }

  /* ============================================================
     PIPELINE MOTIF — the signature mask -> restore flow
     A row of three nodes (DETECT, MASK, RESTORE) joined by wires down
     which a packet travels on a loop, syncing with the badge pulse.
     ============================================================ */
  .al-pipeline { padding: var(--space-6) var(--space-8); overflow: hidden; }
  .al-pipeline__head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-6); flex-wrap: wrap; }
  .al-pipeline__flow {
    display: grid;
    grid-template-columns: 1fr auto 1fr auto 1fr;
    align-items: center; gap: 0;
  }
  .al-node {
    display: flex; flex-direction: column; gap: 8px;
    padding: var(--space-4) var(--space-5);
    border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
    background: var(--surface-inset);
    min-width: 0;
  }
  .al-node__top { display: flex; align-items: center; gap: 9px; }
  .al-node__no {
    font-family: var(--font-mono); font-size: var(--text-2xs);
    letter-spacing: var(--tracking-caps); color: var(--text-faint);
  }
  .al-node__name {
    font-family: var(--font-mono); font-size: var(--text-xs);
    letter-spacing: var(--tracking-caps); text-transform: uppercase;
    color: var(--text-strong); font-weight: var(--weight-medium);
  }
  .al-node__icon {
    width: 28px; height: 28px; flex: none; border-radius: var(--radius-sm);
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--accent-border); color: var(--accent);
    background: var(--accent-soft);
  }
  .al-node__icon svg { width: 15px; height: 15px; }
  .al-node--restore .al-node__icon { border-color: var(--clear-border); color: var(--clear); background: var(--clear-soft); }
  .al-node--mask .al-node__icon { border-color: var(--caught-border); color: var(--caught); background: var(--caught-soft); }
  .al-node__val {
    font-family: var(--font-mono); font-variant-numeric: tabular-nums;
    font-size: var(--text-lg); color: var(--text-strong); line-height: 1; font-weight: var(--weight-medium);
  }
  .al-node__cap { font-family: var(--font-mono); font-size: var(--text-2xs); letter-spacing: var(--tracking-caps); color: var(--text-muted); text-transform: uppercase; }

  /* Wire between two nodes: a track with a travelling packet. */
  .al-wire { position: relative; height: 2px; min-width: 36px; margin: 0 6px; align-self: center; background: var(--border-default); border-radius: 2px; overflow: visible; }
  .al-wire__pulse {
    position: absolute; top: 50%; left: 0; width: 8px; height: 8px; margin-top: -4px;
    border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 10px 1px color-mix(in oklab, var(--seal-400) 80%, transparent);
    animation: al-travel 2200ms var(--ease-inout) infinite;
  }
  .al-wire--restore { background: var(--clear-500); opacity: 0.5; }
  .al-wire--restore .al-wire__pulse { background: var(--clear-400); box-shadow: 0 0 10px 1px color-mix(in oklab, var(--clear-400) 80%, transparent); animation-delay: 1100ms; }
  @keyframes al-travel {
    0%   { left: 0;    opacity: 0; }
    12%  { opacity: 1; }
    88%  { opacity: 1; }
    100% { left: 100%; opacity: 0; }
  }

  /* ============================================================
     GRIDS
     ============================================================ */
  .al-headline { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-4); margin-bottom: var(--space-5); }
  .al-headline .al-card { padding: var(--space-6); display: flex; align-items: flex-start; gap: var(--space-4); }
  .al-headline__icon {
    flex: none; width: 42px; height: 42px; border-radius: var(--radius-md);
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--surface-inset); color: var(--text-muted);
    border: 1px solid var(--border-subtle);
  }
  .al-headline__icon svg { width: 20px; height: 20px; }
  .al-headline__icon--caught { background: var(--caught-soft); color: var(--caught); border-color: var(--caught-border); }
  .al-headline__icon--accent { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-border); }
  .al-headline__icon--clear  { background: var(--clear-soft);  color: var(--clear);  border-color: var(--clear-border); }
  .al-headline .al-metric { flex: 1; min-width: 0; }

  .al-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: var(--space-4); margin-bottom: var(--space-5); }
  .al-grid--license { grid-template-columns: 1fr 1fr; gap: var(--space-4); margin-bottom: var(--space-5); }

  /* ---- Panel ---- */
  .al-panel { padding: var(--space-6); }
  .al-panel__head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-6); }
  .al-panel__title { font-size: var(--text-md); font-weight: var(--weight-semibold); color: var(--text-strong); }

  /* ---- Legend ---- */
  .al-legend { display: flex; align-items: center; gap: var(--space-4); font-family: var(--font-mono); font-size: var(--text-2xs); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-muted); }
  .al-legend__item { display: inline-flex; align-items: center; gap: 7px; }
  .al-legend__item i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }

  /* ---- Traffic chart (hand-rolled bars) ---- */
  .al-chart { display: flex; align-items: flex-end; gap: var(--space-3); height: 196px; padding-top: var(--space-2); }
  .al-chart__col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: var(--space-2); min-width: 0; }
  .al-chart__bar {
    width: 100%; max-width: 44px; min-height: 3px;
    background: var(--seal-600); border-radius: var(--radius-sm) var(--radius-sm) 2px 2px;
    position: relative; display: flex; flex-direction: column; justify-content: flex-start;
    overflow: hidden; transition: height var(--dur-slow) var(--ease-out);
  }
  .al-chart__caught { width: 100%; background: var(--caught-500); transition: height var(--dur-slow) var(--ease-out); }
  .al-chart__lbl { font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--text-faint); white-space: nowrap; }
  .al-chart__empty, .al-empty { display: flex; align-items: center; justify-content: center; min-height: 160px; color: var(--text-faint); font-size: var(--text-sm); text-align: center; flex-direction: column; gap: 8px; padding: var(--space-6); }
  .al-empty__title { font-size: var(--text-md); color: var(--text-strong); }

  /* ---- Detector breakdown ---- */
  .al-detlist { display: flex; flex-direction: column; gap: var(--space-4); }
  .al-detrow { display: grid; grid-template-columns: 142px 1fr 52px; align-items: center; gap: var(--space-4); }
  .al-detrow__track { height: 7px; background: var(--surface-inset); border-radius: var(--radius-pill); overflow: hidden; }
  .al-detrow__fill { height: 100%; background: linear-gradient(90deg, var(--seal-600), var(--seal-400)); border-radius: var(--radius-pill); transition: width var(--dur-slow) var(--ease-out); }
  .al-detrow--pro .al-detrow__fill { background: linear-gradient(90deg, var(--pro-500), var(--pro-300)); }
  .al-detrow__count { font-family: var(--font-mono); font-size: var(--text-sm); color: var(--text-body); text-align: right; }

  /* ---- License panel ---- */
  .al-license { display: flex; flex-direction: column; gap: var(--space-5); }
  .al-license__tier { display: flex; align-items: baseline; gap: var(--space-3); }
  .al-license__tiername { font-family: var(--font-mono); font-size: var(--text-xl); letter-spacing: -0.01em; color: var(--text-strong); font-weight: var(--weight-medium); }
  .al-license__rows { display: flex; flex-direction: column; gap: var(--space-3); }
  .al-license__row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); padding: var(--space-3) 0; border-top: 1px solid var(--border-subtle); }
  .al-license__row:first-child { border-top: none; }
  .al-license__k { font-family: var(--font-mono); font-size: var(--text-xs); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-muted); }
  .al-license__v { font-family: var(--font-mono); font-size: var(--text-sm); color: var(--text-body); }

  /* ---- Table ---- */
  .al-tablewrap { width: 100%; overflow-x: auto; overscroll-behavior-inline: contain; }
  .al-table { width: 100%; min-width: 680px; border-collapse: collapse; font-size: var(--text-sm); }
  .al-table th {
    text-align: left; font-family: var(--font-mono); font-size: var(--text-2xs);
    letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-faint);
    font-weight: var(--weight-medium); padding: 0 var(--space-3) var(--space-3); border-bottom: 1px solid var(--border-subtle);
  }
  .al-table td { padding: var(--space-3); border-bottom: 1px solid var(--border-subtle); vertical-align: middle; }
  .al-table tbody tr:last-child td { border-bottom: none; }
  .al-table tbody tr { transition: background var(--dur-fast) var(--ease-out); }
  .al-table tbody tr:hover { background: var(--surface-inset); }
  .al-detcell { display: flex; gap: 6px; flex-wrap: wrap; }

  /* ---- Endpoints ---- */
  .al-endpoints { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-4); }
  .al-code {
    margin: 0; padding: var(--space-4); border-radius: var(--radius-md);
    background: var(--surface-code); color: var(--text-body);
    font-family: var(--font-mono); font-size: var(--text-xs); line-height: var(--leading-relaxed);
    overflow: auto; white-space: pre; border: 1px solid var(--border-subtle);
  }
  .al-note { font-size: var(--text-sm); color: var(--text-muted); line-height: var(--leading-relaxed); }
  .al-note + .al-note { margin-top: var(--space-3); }

  /* ---- Section spacer ---- */
  .al-stack { margin-top: var(--space-5); }

  /* ============================================================
     RESPONSIVE
     ============================================================ */
  @media (max-width: 980px) {
    .al-headline { grid-template-columns: 1fr; }
    .al-grid, .al-grid--license { grid-template-columns: 1fr; }
    .al-endpoints { grid-template-columns: 1fr; }
    .al-pipeline__flow { grid-template-columns: 1fr; gap: var(--space-3); }
    .al-wire { width: 2px; height: 28px; min-width: 0; margin: 0 auto; }
    .al-wire__pulse { left: 50%; top: 0; margin-left: -4px; margin-top: 0; animation-name: al-travel-v; }
    @keyframes al-travel-v { 0% { top: 0; opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
    .al-topbar { padding: 0 var(--space-4); gap: var(--space-3); }
    .al-page { padding: var(--space-8) var(--space-4) var(--space-12); }
    .al-topbar__status .al-badge--static { display: none; }
  }
  @media (max-width: 620px) {
    .al-topbar { height: auto; min-height: 62px; flex-wrap: wrap; padding-block: var(--space-3); }
    .al-topbar__brand svg { width: 118px; height: auto; }
    .al-topbar__brand .al-topbar__sep, .al-topbar__title { display: none; }
    .al-topbar__status { margin-left: auto; }
    .al-topbar__actions { width: 100%; margin-left: 0; justify-content: space-between; }
    .al-tabs { flex: 1; }
    .al-tab { flex: 1; }
    .al-page { padding-inline: var(--space-3); }
    .al-pipeline { padding: var(--space-5); }
    .al-detrow { grid-template-columns: 110px 1fr 44px; gap: var(--space-3); }
  }

  /* ============================================================
     REDUCED MOTION — turn off every animation and transition
     ============================================================ */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
    .al-rise { opacity: 1; transform: none; }
    .al-wire__pulse { opacity: 0; }
    .al-badge__dot { box-shadow: none; opacity: 1; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script>
  /* ============================================================================
     Promtect dashboard — vanilla JS. No framework. Builds the DOM and wires it to
     the live, value-free GET /api/metrics feed (polled every 4s). The data model
     (buildModel) and JSON shape are unchanged from the previous version; only the
     presentation layer was rebuilt. Nothing here ever touches a secret value.
     ============================================================================ */
  (function () {
    "use strict";

    // ---- tiny DOM builder -----------------------------------------------------
    function el(tag, attrs, children) {
      var node = document.createElement(tag);
      if (attrs) {
        for (var k in attrs) {
          if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
          var v = attrs[k];
          if (v == null || v === false) continue;
          if (k === "class") node.className = v;
          else if (k === "html") node.innerHTML = v;
          else if (k === "text") node.textContent = v;
          else if (k === "title") node.title = v;
          else if (k === "style") node.setAttribute("style", v);
          else if (k.slice(0, 2) === "on" && typeof v === "function") node.addEventListener(k.slice(2), v);
          else node.setAttribute(k, v);
        }
      }
      if (children != null) appendChildren(node, children);
      return node;
    }
    function appendChildren(node, children) {
      if (Array.isArray(children)) {
        children.forEach(function (c) { appendChildren(node, c); });
      } else if (children != null && children !== false) {
        node.appendChild(typeof children === "object" ? children : document.createTextNode(String(children)));
      }
    }
    // Inline lucide-style icon, stroke 1.75. No namespace decl / URL — offline-safe.
    function iconSpan(inner, cls) {
      var wrap = el("span", { class: cls || "" });
      wrap.innerHTML =
        '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor"' +
        ' stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + inner + "</svg>";
      return wrap;
    }

    var ICON = {
      shield:  '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',
      refresh: '<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
      activity:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
      lock:    '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
      scan:    '<path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/>',
      mask:    '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><line x1="2" y1="2" x2="22" y2="22"/>',
      undo:    '<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-1"/>',
      sparkle: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><path d="m6.3 6.3 2.4 2.4M15.3 15.3l2.4 2.4M17.7 6.3l-2.4 2.4M8.7 15.3l-2.4 2.4"/>'
    };

    // ---- formatting helpers ---------------------------------------------------
    function fmt(n) { n = Number(n) || 0; return n.toLocaleString("en-US"); }
    function ago(tsMs) {
      var s = Math.round((Date.now() - Number(tsMs)) / 1000);
      if (s < 0) s = 0;
      if (s < 60) return s + "s ago";
      var m = Math.round(s / 60);
      if (m < 60) return m + "m ago";
      var h = Math.round(m / 60);
      if (h < 24) return h + "h ago";
      return Math.round(h / 24) + "d ago";
    }
    function bytes(b) {
      b = Number(b) || 0;
      if (b < 1024) return b + " B";
      if (b < 1024 * 1024) return (b / 1024).toFixed(1) + " KB";
      if (b < 1024 * 1024 * 1024) return (b / 1024 / 1024).toFixed(1) + " MB";
      return (b / 1024 / 1024 / 1024).toFixed(2) + " GB";
    }
    function rid8(id) { return (id || "").replace(/-/g, "").slice(0, 8) || "--------"; }

    // ---- Pro-class detector heuristic -----------------------------------------
    // The free core masks provider credentials (kinds ending in _key/_token/_pat/
    // _secret, e.g. aws_key, github_token). The paid promtect-pro crate adds a
    // DIFFERENT CLASS of detector: entropy-based and PII/PHI. We do NOT hardcode
    // the free list — instead we recognise the small, stable set of Pro-class kind
    // names. If any Pro-class kind appears in the live audit, Pro is "active".
    // (/api/metrics has no explicit license field today; presence is the signal.)
    var PRO_KINDS = {
      entropy: 1, email: 1, credit_card: 1, ssn: 1, phone: 1, ipv4: 1, ipv6: 1,
      iban: 1, swift: 1, us_passport: 1, dob: 1, mrn: 1, npi: 1, dea: 1,
      ip_address: 1, jwt_pii: 1, pii: 1, phi: 1
    };
    function isProKind(kind) { return Object.prototype.hasOwnProperty.call(PRO_KINDS, String(kind)); }

    // ---- reusable component builders ------------------------------------------
    function Badge(opts) {
      var tone = opts.tone || "neutral";
      var cls = "al-badge al-badge--" + tone + (opts.staticDot ? " al-badge--static" : "");
      var node = el("span", { class: cls });
      if (opts.dot) node.appendChild(el("span", { class: "al-badge__dot" }));
      appendChildren(node, opts.label);
      return node;
    }
    function DetectorTag(kind) {
      var pro = isProKind(kind);
      return el("span", { class: "al-detector" + (pro ? " al-detector--pro" : ""), title: pro ? "Pro-class detector" : null }, [
        el("span", { class: "al-detector__mark" }),
        kind
      ]);
    }
    function Card(opts, children) {
      opts = opts || {};
      var attrs = { class: "al-card" + (opts.className ? " " + opts.className : "") };
      if (opts.index) attrs["data-index"] = opts.index;
      return el("div", attrs, children);
    }
    function MetricStat(opts) {
      var cls = "al-metric" + (opts.tone ? " al-metric--" + opts.tone : "");
      return el("div", { class: cls }, [
        el("div", { class: "al-metric__label" }, opts.label),
        el("div", { class: "al-metric__value al-tabular" }, opts.value),
        opts.foot ? el("div", { class: "al-metric__foot" }, el("span", { class: "al-faint al-mono" }, opts.foot)) : null
      ]);
    }
    function panelHead(eyebrow, title, right) {
      return el("div", { class: "al-panel__head" }, [
        el("div", null, [
          el("div", { class: "al-eyebrow", style: "margin-bottom: 6px" }, eyebrow),
          el("h3", { class: "al-panel__title" }, title)
        ]),
        right || null
      ]);
    }

    // ===========================================================================
    //  TOP BAR — brand + sync-pulse status pills + view tabs + refresh
    // ===========================================================================
    function TopBar(state, actions) {
      var brand = el("div", { class: "al-topbar__brand" });
      brand.innerHTML =
        '<svg width="150" height="30" viewBox="0 0 200 48" fill="none" role="img" aria-label="Promtect">' +
        '<circle cx="24" cy="24" r="18.25" stroke="#25c2b1" stroke-width="3.5"></circle>' +
        '<circle cx="15.5" cy="24" r="2.7" fill="#25c2b1"></circle>' +
        '<circle cx="24" cy="24" r="2.7" fill="#25c2b1"></circle>' +
        '<circle cx="32.5" cy="24" r="2.7" fill="#25c2b1"></circle>' +
        '<text x="56" y="32" font-family="var(--font-sans)" font-size="25" font-weight="600" letter-spacing="-0.5" fill="#eef2f5">Promtect</text>' +
        '</svg>';
      brand.appendChild(el("span", { class: "al-topbar__sep" }));
      brand.appendChild(el("span", { class: "al-topbar__title" }, "Dashboard"));

      var connTone = state.connected ? "clear" : "leak";
      var connText = state.connected ? "live" : "offline";
      var status = el("div", { class: "al-topbar__status", "aria-live": "polite" }, [
        Badge({ tone: "accent", staticDot: true, dot: true, label: "127.0.0.1:8799" }),
        Badge({ tone: "neutral", staticDot: true, dot: true, label: "loopback" }),
        Badge({ tone: connTone, dot: true, label: connText })
      ]);

      var refreshBtn = el("button", {
        class: "al-iconbtn", type: "button",
        "aria-label": "Refresh metrics", title: "Refresh",
        onclick: function (e) {
          var b = e.currentTarget;
          b.classList.remove("is-spinning");
          void b.offsetWidth;
          b.classList.add("is-spinning");
          actions.onRefresh();
        }
      });
      refreshBtn.appendChild(iconSpan(ICON.refresh).firstChild);

      var tabItems = [
        { value: "overview", label: "Overview" },
        { value: "endpoints", label: "Endpoints" }
      ];
      var tabs = el("div", { class: "al-tabs", role: "tablist", "aria-label": "Dashboard views" }, tabItems.map(function (it, index) {
        return el("button", {
          class: "al-tab" + (it.value === state.view ? " al-tab--active" : ""),
          id: "tab-" + it.value, type: "button", role: "tab",
          "aria-controls": "dashboard-panel",
          "aria-selected": it.value === state.view ? "true" : "false",
          tabindex: it.value === state.view ? "0" : "-1",
          onclick: function () { actions.onView(it.value, true); },
          onkeydown: function (event) {
            var next = index;
            if (event.key === "ArrowRight") next = (index + 1) % tabItems.length;
            else if (event.key === "ArrowLeft") next = (index + tabItems.length - 1) % tabItems.length;
            else if (event.key === "Home") next = 0;
            else if (event.key === "End") next = tabItems.length - 1;
            else return;
            event.preventDefault();
            actions.onView(tabItems[next].value, true);
          }
        }, it.label);
      }));

      var actionsRow = el("div", { class: "al-topbar__actions" }, [tabs, refreshBtn]);
      return el("header", { class: "al-topbar" }, [brand, status, actionsRow]);
    }

    // ===========================================================================
    //  PIPELINE MOTIF — live mask -> restore flow with sync-pulse badges
    // ===========================================================================
    function Pipeline(d, state) {
      var restoreLabel = d.restoreOn ? "restore on" : "strict mode";
      var head = el("div", { class: "al-pipeline__head" }, [
        el("div", null, [
          el("div", { class: "al-eyebrow", style: "margin-bottom: 6px" }, "Pipeline · request lifecycle"),
          el("h3", { class: "al-panel__title" }, d.restoreOn ? "Mask, forward, restore" : "Mask and forward in strict mode")
        ]),
        el("div", { class: "al-legend", style: "gap: var(--space-3)" }, [
          Badge({ tone: state.connected ? "clear" : "leak", dot: true, label: state.connected ? "syncing" : "paused" }),
          Badge({ tone: "accent", staticDot: true, dot: true, label: restoreLabel })
        ])
      ]);

      function node(no, name, icon, mod, value, cap) {
        var icn = el("span", { class: "al-node__icon" });
        icn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + icon + "</svg>";
        return el("div", { class: "al-node" + (mod ? " al-node--" + mod : "") }, [
          el("div", { class: "al-node__top" }, [
            icn,
            el("div", null, [
              el("div", { class: "al-node__no" }, no),
              el("div", { class: "al-node__name" }, name)
            ])
          ]),
          el("div", { class: "al-node__val al-tabular" }, value),
          el("div", { class: "al-node__cap" }, cap)
        ]);
      }
      function wire(restore) {
        return el("div", { class: "al-wire" + (restore ? " al-wire--restore" : "") },
          el("span", { class: "al-wire__pulse" }));
      }

      var flow = el("div", { class: "al-pipeline__flow" }, [
        node("01", "Detect", ICON.scan, "detect", fmt(d.headline.requestsProtected), "requests scanned"),
        wire(false),
        node("02", "Mask", ICON.mask, "mask", fmt(d.headline.secretsMasked), "secrets masked"),
        wire(d.restoreOn),
        d.restoreOn
          ? node("03", "Restore", ICON.undo, "restore", fmt(d.headline.secretsRestored), "secrets restored")
          : node("03", "Restore off", ICON.lock, "", "OFF", "strict mode active")
      ]);

      return Card({ className: "al-pipeline al-rise" }, [head, flow]);
    }

    // ===========================================================================
    //  HEADLINE — distinct value-free lifecycle outcomes
    // ===========================================================================
    function Headline(d) {
      var h = d.headline;
      function icon(mod, glyph) {
        var n = el("div", { class: "al-headline__icon al-headline__icon--" + mod });
        n.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + glyph + "</svg>";
        return n;
      }
      return el("div", { class: "al-headline al-rise", style: "animation-delay: 60ms" }, [
        Card({ index: "01" }, [icon("caught", ICON.shield), MetricStat({
          label: "Secrets masked", value: fmt(h.secretsMasked), tone: "caught", foot: "forwarded as sentinels"
        })]),
        Card({ index: "02" }, [icon("accent", ICON.activity), MetricStat({
          label: "Requests protected", value: fmt(h.requestsProtected), tone: "accent", foot: "all-time"
        })]),
        Card({ index: "03" }, [icon("clear", ICON.lock), MetricStat({
          label: "Requests blocked", value: fmt(h.requestsBlocked), tone: "caught", foot: "not forwarded"
        })]),
        Card({ index: "04" }, [icon("clear", ICON.undo), MetricStat({
          label: "Secrets restored", value: fmt(h.secretsRestored), tone: "clear", foot: "response sentinels expanded"
        })]),
        Card({ index: "05" }, [icon("accent", ICON.sparkle), MetricStat({
          label: "Output secrets", value: fmt(h.outputSecrets), tone: "accent", foot: "response-side findings"
        })]),
        Card({ index: "06" }, [icon("caught", ICON.activity), MetricStat({
          label: "Failures", value: fmt(h.failures), tone: "caught", foot: fmt(h.streamInterruptions) + " interrupted streams"
        })])
      ]);
    }

    // ===========================================================================
    //  TRAFFIC — caught vs clean, bucketed by hour from recent[].ts_ms
    // ===========================================================================
    function Timeline(d) {
      var legend = el("div", { class: "al-legend" }, [
        el("span", { class: "al-legend__item" }, [el("i", { style: "background: var(--caught-500)" }), "caught"]),
        el("span", { class: "al-legend__item" }, [el("i", { style: "background: var(--seal-500)" }), "clean"])
      ]);
      var head = panelHead("Traffic · by hour", "Caught vs clean", legend);

      var body;
      if (!d.timeline.length) {
        body = el("div", { class: "al-chart__empty" }, "No recent requests to chart yet.");
      } else {
        var max = d.timeline.reduce(function (a, b) { return Math.max(a, b.caught + b.clean); }, 1);
        body = el("div", { class: "al-chart" }, d.timeline.map(function (b) {
          var total = b.caught + b.clean;
          var hPct = (total / max) * 100;
          var caughtPct = total ? (b.caught / total) * 100 : 0;
          var bar = el("div", { class: "al-chart__bar", style: "height: " + hPct + "%" },
            [el("div", { class: "al-chart__caught", style: "height: " + caughtPct + "%" })]);
          return el("div", { class: "al-chart__col", title: fmt(b.caught) + " caught · " + fmt(b.clean) + " clean" },
            [bar, el("span", { class: "al-chart__lbl" }, b.label)]);
        }));
      }
      return Card({ className: "al-panel", index: "04" }, [head, body]);
    }

    // ===========================================================================
    //  DETECTORS — horizontal bars by kind, sorted desc (Pro kinds tinted violet)
    // ===========================================================================
    function Detectors(d) {
      var top = d.byDetector.slice(0, 8);
      var head = panelHead("Breakdown · live", "Secrets by detector",
        Badge({ tone: "neutral", staticDot: false, label: top.length + " kinds" }));
      var body;
      if (!top.length) {
        body = el("div", { class: "al-empty" }, [
          el("div", { class: "al-empty__title" }, "No detectors fired"),
          el("div", { class: "al-note" }, "Detector counts appear here once a secret is masked.")
        ]);
      } else {
        var max = top.reduce(function (a, x) { return Math.max(a, x.count); }, 1);
        body = el("div", { class: "al-detlist" }, top.map(function (row) {
          return el("div", { class: "al-detrow" + (row.pro ? " al-detrow--pro" : "") }, [
            DetectorTag(row.kind),
            el("div", { class: "al-detrow__track" }, [
              el("div", { class: "al-detrow__fill", style: "width: " + (row.count / max) * 100 + "%" })
            ]),
            el("span", { class: "al-detrow__count al-tabular" }, fmt(row.count))
          ]);
        }));
      }
      return Card({ className: "al-panel", index: "05" }, [head, body]);
    }

    // ===========================================================================
    //  LICENSE — Pro / license status driven by Pro-class kind presence
    // ===========================================================================
    function License(d) {
      var active = d.pro.active;
      var head = panelHead("License · detector tier",
        active ? "Pro detectors active" : "Free core active",
        Badge({ tone: active ? "pro" : "neutral", dot: true, label: active ? "pro" : "free" }));

      var tier = el("div", { class: "al-license__tier" }, [
        el("span", { class: "al-license__tiername" }, active ? "Promtect Pro" : "Promtect Free"),
        Badge({ tone: active ? "pro" : "clear", staticDot: true, dot: true, label: active ? "entropy · PII/PHI" : "known detectors" })
      ]);

      var rows = el("div", { class: "al-license__rows" }, [
        row("Free-core kinds", fmt(d.pro.freeKinds) + " active"),
        row("Pro-class kinds", active ? fmt(d.pro.proKinds) + " active" : "none observed"),
        row("Status", active ? "Pro-class detectors firing" : "Inferred from audit")
      ]);

      var note = el("p", { class: "al-note", style: "margin-top: var(--space-2)" },
        active
          ? "Pro-class detectors (entropy, PII/PHI) have masked secrets in this log. The tier is inferred from the kinds present in the value-free audit feed."
          : "Only known free-core detectors have fired. Pro adds a different class — entropy and PII/PHI. The tier is inferred from kind presence; the metrics feed exposes no license value.");

      function row(k, v) {
        return el("div", { class: "al-license__row" }, [
          el("span", { class: "al-license__k" }, k),
          el("span", { class: "al-license__v" }, v)
        ]);
      }

      return Card({ className: "al-panel", index: "06" }, [head, el("div", { class: "al-license" }, [tier, rows, note])]);
    }

    // ===========================================================================
    //  BYTES — real bytes_in / bytes_out totals
    // ===========================================================================
    function Bytes(d) {
      var head = panelHead("Throughput · all-time", "Bytes processed",
        Badge({ tone: "accent", staticDot: true, dot: true, label: "before · after" }));
      var body = el("div", { class: "al-headline", style: "margin: 0; grid-template-columns: repeat(2, 1fr)" }, [
        Card({ index: "in" }, [MetricStat({ label: "Bytes in", value: bytes(d.bytesIn), tone: "accent", foot: fmt(d.bytesIn) + " B before masking" })]),
        Card({ index: "out" }, [MetricStat({ label: "Bytes out", value: bytes(d.bytesOut), foot: fmt(d.bytesOut) + " B after masking" })])
      ]);
      return Card({ className: "al-panel", index: "07" }, [head, body]);
    }

    // ===========================================================================
    //  RECENT — value-free request table
    // ===========================================================================
    function Recent(d) {
      var head = panelHead("Stream · newest first", "Recent requests",
        Badge({ tone: "neutral", staticDot: false, label: "value-free" }));
      var thead = el("thead", null, el("tr", null, [
        el("th", null, "Time"), el("th", null, "Request"), el("th", null, "Result"),
        el("th", null, "Detectors"), el("th", { class: "al-right" }, "Masked")
      ]));
      var rows;
      if (!d.recent.length) {
        rows = el("tr", null, el("td", { colspan: "5" }, el("div", { class: "al-empty" }, [
          el("div", { class: "al-empty__title" }, "No requests yet"),
          el("div", { class: "al-note" }, "Point your AI tool at the Promtect proxy to see live traffic.")
        ])));
      } else {
        rows = d.recent.map(function (r) {
          var result = r.interrupted
            ? Badge({ tone: "leak", dot: true, label: "interrupted" })
            : r.failures > 0
              ? Badge({ tone: "leak", dot: true, label: "failed" })
              : r.blocked
                ? Badge({ tone: "caught", dot: true, label: "blocked" })
                : r.outputSecrets > 0
                  ? Badge({ tone: "pro", dot: true, label: r.outputSecrets + " output" })
                  : r.restored > 0
                    ? Badge({ tone: "clear", dot: true, label: r.restored + " restored" })
                    : r.masked > 0
                      ? Badge({ tone: "caught", dot: true, label: r.masked + " masked" })
                      : Badge({ tone: "clear", dot: true, label: "clean" });
          var detCell = el("div", { class: "al-detcell" },
            r.detectors.length
              ? r.detectors.map(function (k) { return DetectorTag(k); })
              : el("span", { class: "al-faint al-mono" }, "—"));
          return el("tr", null, [
            el("td", { class: "al-mono al-faint" }, ago(r.ts)),
            el("td", { class: "al-mono" }, r.reqId),
            el("td", null, result),
            el("td", null, detCell),
            el("td", { class: "al-right al-mono al-faint al-tabular" }, fmt(r.masked))
          ]);
        });
      }
      return Card({ className: "al-panel", index: "08" }, [head,
        el("div", { class: "al-tablewrap", tabindex: "0", "aria-label": "Recent requests table" },
          el("table", { class: "al-table" }, [thead, el("tbody", null, rows)]))]);
    }

    // ===========================================================================
    //  ENDPOINTS VIEW — the two real, live endpoints this UI exposes
    // ===========================================================================
    function Endpoints(d) {
      var h = d.headline;
      var prom = [
        "# HELP promtect_requests_total Total requests proxied.",
        "# TYPE promtect_requests_total counter",
        "promtect_requests_total " + h.requestsProtected,
        "promtect_requests_with_secrets_total " + h.withSecrets,
        "promtect_requests_clean_total " + h.requestsClean,
        "# TYPE promtect_secrets_masked_total counter"
      ].concat(d.byDetector.slice(0, 5).map(function (x) {
        return 'promtect_secrets_masked_total{detector="' + x.kind + '"} ' + x.count;
      })).concat([
        "promtect_bytes_in_total " + d.bytesIn,
        "promtect_bytes_out_total " + d.bytesOut
      ]).join("\n");

      var json = JSON.stringify({
        requests_total: h.requestsProtected,
        requests_with_secrets: h.withSecrets,
        requests_clean: h.requestsClean,
        secrets_masked_total: h.secretsMasked,
        requests_blocked_total: h.requestsBlocked,
        secrets_restored_total: h.secretsRestored,
        output_secrets_total: h.outputSecrets,
        failures_total: h.failures,
        stream_interruptions_total: h.streamInterruptions,
        by_detector: d.byDetector.slice(0, 6).reduce(function (a, x) { a[x.kind] = x.count; return a; }, {}),
        bytes_in_total: d.bytesIn,
        bytes_out_total: d.bytesOut
      }, null, 2);

      var promCard = Card({ className: "al-panel", index: "A" }, [
        panelHead("Observability", "GET /metrics", Badge({ tone: "accent", staticDot: true, dot: true, label: "Prometheus" })),
        el("pre", { class: "al-code" }, prom)
      ]);
      var jsonCard = Card({ className: "al-panel", index: "B" }, [
        panelHead("Web UI feed", "GET /api/metrics", Badge({ tone: "accent", staticDot: true, dot: true, label: "JSON" })),
        el("pre", { class: "al-code" }, json)
      ]);
      var noteCard = Card({ className: "al-panel", index: "C" }, [
        panelHead("Scope", "All-time, value-free", Badge({ tone: "neutral", staticDot: false, label: "honest" })),
        el("p", { class: "al-note" }, "Promtect's metrics are aggregated live from the value-free audit log and are cumulative (all-time). The proxy does not record per-endpoint counts or a time-series history, so this dashboard shows no per-route breakdown and labels every range as all-time. Nothing here is fabricated."),
        el("p", { class: "al-note" }, "The Caught vs clean chart is derived by bucketing the recent requests feed by hour. When traffic is sparse it shows only the buckets that actually have data.")
      ]);

      return el("div", { class: "al-endpoints al-rise" }, [promCard, jsonCard, noteCard]);
    }

    // ===========================================================================
    //  EMPTY STATE
    // ===========================================================================
    function EmptyState() {
      return Card({ className: "al-panel al-rise", index: "00" }, [
        el("div", { class: "al-empty" }, [
          el("div", { class: "al-empty__title" }, "No traffic yet"),
          el("p", { class: "al-note", style: "max-width: 52ch" }, "Point your AI tool at the Promtect proxy (default 127.0.0.1:8790) and your secrets are masked at the door. Counts, detector kinds and byte sizes appear here — never a secret value.")
        ])
      ]);
    }

    // ===========================================================================
    //  DATA — map the live /api/metrics payload into the render model.
    //  Identical field reads to the previous version, plus a Pro-tier inference
    //  derived purely from which detector kinds are present (no new API field).
    // ===========================================================================
    function buildModel(m) {
      m = m || {};
      var total = Number(m.requests_total) || 0;
      var withSecrets = Number(m.requests_with_secrets) || 0;
      var clean = Number(m.requests_clean) || 0;
      var byDetObj = m.by_detector || {};

      var byDetector = Object.keys(byDetObj)
        .map(function (k) { return { kind: k, count: Number(byDetObj[k]) || 0, pro: isProKind(k) }; })
        .sort(function (a, b) { return b.count - a.count; });

      // Pro-tier inference: count free-core vs Pro-class kinds among those that
      // actually fired. Any Pro-class kind present => Pro is active.
      var proKinds = 0, freeKinds = 0;
      byDetector.forEach(function (x) { if (x.pro) proKinds += 1; else freeKinds += 1; });

      var recent = (Array.isArray(m.recent) ? m.recent : []).map(function (r) {
        return {
          ts: Number(r.ts_ms) || 0,
          reqId: rid8(r.request_id),
          masked: Number(r.masked) || 0,
          blocked: Boolean(r.blocked),
          restored: Number(r.restored) || 0,
          outputSecrets: Number(r.output_secrets) || 0,
          failures: Number(r.failures) || 0,
          interrupted: Boolean(r.interrupted),
          detectors: Array.isArray(r.detectors) ? r.detectors.slice() : []
        };
      });

      var timeline = deriveTimeline(m.recent);
      var cleanPct = total > 0 ? ((clean / total) * 100).toFixed(1) : "0.0";

      return {
        empty: total === 0,
        headline: {
          secretsMasked: Number(m.secrets_masked_total) || 0,
          requestsBlocked: Number(m.requests_blocked_total) || 0,
          secretsRestored: Number(m.secrets_restored_total) || 0,
          outputSecrets: Number(m.output_secrets_total) || 0,
          failures: Number(m.failures_total) || 0,
          streamInterruptions: Number(m.stream_interruptions_total) || 0,
          requestsProtected: total,
          requestsClean: clean,
          cleanPct: cleanPct,
          withSecrets: withSecrets
        },
        timeline: timeline,
        byDetector: byDetector,
        recent: recent,
        bytesIn: Number(m.bytes_in_total) || 0,
        bytesOut: Number(m.bytes_out_total) || 0,
        restoreOn: m.restore_enabled === true,
        pro: { active: proKinds > 0, proKinds: proKinds, freeKinds: freeKinds }
      };
    }

    // Bucket the recent feed by clock-hour: caught (masked>0) vs clean (masked===0).
    // Oldest -> newest, capped at the 12 most-recent buckets.
    function deriveTimeline(recent) {
      if (!Array.isArray(recent) || !recent.length) return [];
      var HOUR = 3600 * 1000;
      var buckets = {};
      recent.forEach(function (r) {
        var ts = Number(r.ts_ms) || 0;
        if (!ts) return;
        var key = Math.floor(ts / HOUR);
        if (!buckets[key]) buckets[key] = { key: key, caught: 0, clean: 0 };
        if ((Number(r.masked) || 0) > 0) buckets[key].caught += 1;
        else buckets[key].clean += 1;
      });
      var keys = Object.keys(buckets).map(Number).sort(function (a, b) { return a - b; }).slice(-12);
      return keys.map(function (k) {
        var b = buckets[k];
        var dt = new Date(k * HOUR);
        var hh = ("0" + dt.getHours()).slice(-2);
        return { label: hh + ":00", caught: b.caught, clean: b.clean };
      });
    }

    // ===========================================================================
    //  APP SHELL — state + render + polling
    // ===========================================================================
    var ENDPOINT = "/api/metrics";
    var POLL_MS = 4000;

    var state = {
      view: "overview",
      connected: false,
      model: buildModel(null)
    };

    function render() {
      var d = state.model;
      var main = el("main", {
        class: "al-page", id: "dashboard-panel", role: "tabpanel",
        "aria-labelledby": "tab-" + state.view
      }, [
        el("div", { class: "al-page__head al-rise" }, [
          el("div", { class: "al-page__kicker" },
            Badge({ tone: "accent", staticDot: true, dot: true, label: "Local · offline · value-free" })),
          el("h1", { class: "al-page__h1" }, "Secrets, caught at the door."),
          el("p", { class: "al-page__sub" },
            "Local, fully-offline metrics for the Promtect proxy. Counts, detector kinds and byte sizes only — never a secret value or body content.")
        ])
      ]);

      if (state.view === "overview") {
        main.appendChild(Pipeline(d, state));
        if (d.empty) {
          main.appendChild(el("div", { class: "al-stack" }, EmptyState()));
        } else {
          main.appendChild(el("div", { class: "al-stack" }, Headline(d)));
          main.appendChild(el("div", { class: "al-grid al-rise", style: "animation-delay: 120ms" }, [Timeline(d), Detectors(d)]));
          main.appendChild(el("div", { class: "al-grid--license al-rise", style: "animation-delay: 160ms" }, [License(d), Bytes(d)]));
          main.appendChild(el("div", { class: "al-rise", style: "animation-delay: 200ms" }, Recent(d)));
        }
      } else {
        main.appendChild(el("div", { class: "al-stack" }, Endpoints(d)));
      }

      var app = el("div", { class: "al-app" }, [
        TopBar(state, {
          onView: function (v, focusTab) {
            state.view = v;
            render();
            if (focusTab) document.getElementById("tab-" + v).focus();
          },
          onRefresh: function () { poll(); }
        }),
        main
      ]);

      var root = document.getElementById("root");
      root.textContent = "";
      root.appendChild(app);
    }

    // Signature of what is currently painted. Re-rendering rebuilds the whole DOM,
    // which re-fires the al-rise entrance animations and visibly flashes the page.
    // So we only repaint when the connection state or the metrics actually change.
    var lastSig = null;

    function poll() {
      fetch(ENDPOINT, { headers: { accept: "application/json" }, cache: "no-store" })
        .then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .then(function (json) {
          state.connected = true;
          state.model = buildModel(json);
          var sig = "on|" + JSON.stringify(json);
          if (sig === lastSig) return; // unchanged → no repaint, no blink
          lastSig = sig;
          render();
        })
        .catch(function () {
          // Keep the last good model; just flip the connection badge to offline.
          state.connected = false;
          if (lastSig === "off") return; // already showing offline → no repaint
          lastSig = "off";
          render();
        });
    }

    render();
    poll();
    setInterval(poll, POLL_MS);
  })();
  </script>
</body>
</html>
