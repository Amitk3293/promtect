<!doctype html><html><head><meta charset="utf-8"><title>Airlock — Dashboard</title>
<style>body{font-family:system-ui,sans-serif;margin:2rem;background:#0b0e14;color:#e6e6e6}
.stat{display:inline-block;margin:1rem 2rem 1rem 0}.n{font-size:2rem;font-weight:700}
.l{opacity:.7;font-size:.85rem}table{border-collapse:collapse;margin-top:1rem}
td,th{padding:.3rem .8rem;text-align:left;border-bottom:1px solid #222}</style></head>
<body><h1>&#x1F512; Airlock</h1><div id="stats">loading&#x2026;</div>
<h2>Secrets masked by type</h2><table id="bytype"><tbody></tbody></table>
<script>
async function load(){
  const m = await (await fetch('/api/metrics')).json();
  document.getElementById('stats').innerHTML =
    `<div class="stat"><div class="n">${m.secrets_masked_total}</div><div class="l">secrets blocked</div></div>`+
    `<div class="stat"><div class="n">${m.requests_with_secrets}</div><div class="l">requests protected</div></div>`+
    `<div class="stat"><div class="n">${m.requests_total}</div><div class="l">requests total</div></div>`+
    `<div class="stat"><div class="n">${m.requests_clean}</div><div class="l">clean</div></div>`;
  const tb=document.querySelector('#bytype tbody'); tb.innerHTML='';
  for(const [k,v] of Object.entries(m.by_detector||{})){
    const tr=document.createElement('tr'); tr.innerHTML=`<td>${k}</td><td>${v}</td>`; tb.appendChild(tr);
  }
}
load(); setInterval(load, 3000);
</script></body></html>
