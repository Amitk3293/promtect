<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airlock — Dashboard</title>
<!--
  Airlock dashboard — a single self-contained file, ported from the Airlock
  Design System (project "Airlock Design System"). ALL CSS and JS are inline.
  ZERO external network: no CDN, no React/Babel, no Google Fonts. The brand
  marks are inline SVG. Airlock is a privacy tool, so the dashboard that watches
  your secrets must never phone home.

  The original design was React + Babel loaded from unpkg with mock data; here it
  is re-implemented as vanilla JS that builds the same DOM (same class names and
  structure as the design's parts.jsx) and is wired to the live GET /api/metrics
  endpoint, polled every 4s. The design system is the source of truth for the
  visuals (colors, type, spacing, component shapes, layout).

  Fonts: the design uses Geist + Geist Mono (loaded from Google Fonts in the
  source). Offline, those are substituted with the platform's native UI/mono
  stacks via --font-sans / --font-mono, exactly as the design's fonts.css note
  prescribes for the fully-offline product dashboard.
-->
<style>
  /* ============================================================
     TOKENS — fonts (offline substitution for Geist / Geist Mono)
     ============================================================ */
  :root {
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "Geist", system-ui, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", "Geist Mono", Menlo, Consolas, monospace;

    /* --- Type scale (px on a 4px rhythm) --- */
    --text-2xs:  11px;
    --text-xs:   12px;
    --text-sm:   13px;
    --text-base: 15px;
    --text-md:   17px;
    --text-lg:   20px;
    --text-xl:   24px;
    --text-2xl:  32px;
    --text-3xl:  44px;

    /* --- Weights --- */
    --weight-regular:  400;
    --weight-medium:   500;
    --weight-semibold: 600;
    --weight-bold:     700;

    /* --- Line heights --- */
    --leading-tight:   1.18;
    --leading-snug:    1.35;
    --leading-normal:  1.5;
    --leading-relaxed: 1.65;

    /* --- Letter spacing --- */
    --tracking-tight: -0.02em;
    --tracking-snug:  -0.01em;
    --tracking-caps:   0.08em;
  }

  /* ============================================================
     TOKENS — colors (base ramps + semantic aliases, light defaults)
     Dark-first product surface; dark theme overrides below.
     ============================================================ */
  :root {
    /* Neutral ink ramp (cool graphite / slate) */
    --ink-950: #090c10;
    --ink-900: #0e1217;
    --ink-850: #131922;
    --ink-800: #1a212b;
    --ink-750: #1f2832;
    --ink-700: #28323e;
    --ink-600: #364350;
    --ink-500: #4a5a6a;
    --ink-400: #6b7b8b;
    --ink-300: #93a2b1;
    --ink-200: #bcc7d1;
    --ink-100: #dde4ea;
    --ink-50:  #eef2f5;
    --ink-25:  #f7f9fa;
    --white:   #ffffff;

    /* Seal (primary brand) — sealed-chamber teal/cyan */
    --seal-50:  #e6faf7;
    --seal-100: #c2f3ec;
    --seal-200: #8fe8dc;
    --seal-300: #54d8c8;
    --seal-400: #25c2b1;
    --seal-500: #12b5a6;
    --seal-600: #0c9387;
    --seal-700: #0c756c;
    --seal-800: #0d5d57;
    --seal-900: #0c4843;

    /* Caught (amber) — a secret was detected & masked */
    --caught-50:  #fdf3e2;
    --caught-100: #fbe3bb;
    --caught-300: #f4c060;
    --caught-400: #efa838;
    --caught-500: #e2901e;
    --caught-600: #bd7113;
    --caught-700: #935613;

    /* Clear (green) — clean traffic, passed through */
    --clear-50:  #e7f7ee;
    --clear-100: #c3ecd5;
    --clear-300: #6fcf97;
    --clear-400: #43b87a;
    --clear-500: #2ba566;
    --clear-600: #1f8451;
    --clear-700: #1a6741;

    /* Leak (red) — danger / a real leak risk */
    --leak-50:  #fdecea;
    --leak-100: #fbd2cc;
    --leak-300: #f0917f;
    --leak-400: #ea6850;
    --leak-500: #df4a31;
    --leak-600: #bb3722;
    --leak-700: #932c1d;

    /* Semantic aliases (light theme defaults) */
    --bg-canvas:      var(--ink-25);
    --bg-sunken:      var(--ink-50);
    --surface-card:   var(--white);
    --surface-raised: var(--white);
    --surface-inset:  var(--ink-25);
    --surface-code:   var(--ink-900);

    --border-subtle:  var(--ink-100);
    --border-default: var(--ink-200);
    --border-strong:  var(--ink-300);

    --text-strong:    var(--ink-900);
    --text-body:      var(--ink-700);
    --text-muted:     var(--ink-400);
    --text-faint:     var(--ink-300);
    --text-on-accent: var(--white);
    --text-on-code:   var(--ink-100);

    --accent:         var(--seal-600);
    --accent-hover:   var(--seal-700);
    --accent-soft:    var(--seal-50);
    --accent-border:  var(--seal-200);

    --caught:         var(--caught-600);
    --caught-soft:    var(--caught-50);
    --caught-border:  var(--caught-100);

    --clear:          var(--clear-600);
    --clear-soft:     var(--clear-50);
    --clear-border:   var(--clear-100);

    --leak:           var(--leak-600);
    --leak-soft:      var(--leak-50);
    --leak-border:    var(--leak-100);

    --focus-ring:     var(--seal-500);
  }

  /* Dark theme — primary product surface */
  [data-theme="dark"] {
    --bg-canvas:      var(--ink-950);
    --bg-sunken:      var(--ink-900);
    --surface-card:   var(--ink-850);
    --surface-raised: var(--ink-800);
    --surface-inset:  var(--ink-900);
    --surface-code:   var(--ink-900);

    --border-subtle:  var(--ink-800);
    --border-default: var(--ink-700);
    --border-strong:  var(--ink-600);

    --text-strong:    var(--ink-50);
    --text-body:      var(--ink-200);
    --text-muted:     var(--ink-400);
    --text-faint:     var(--ink-500);
    --text-on-accent: var(--ink-950);
    --text-on-code:   var(--ink-100);

    --accent:         var(--seal-400);
    --accent-hover:   var(--seal-300);
    --accent-soft:    color-mix(in oklab, var(--seal-500) 16%, transparent);
    --accent-border:  color-mix(in oklab, var(--seal-500) 38%, transparent);

    --caught:         var(--caught-400);
    --caught-soft:    color-mix(in oklab, var(--caught-500) 15%, transparent);
    --caught-border:  color-mix(in oklab, var(--caught-500) 36%, transparent);

    --clear:          var(--clear-400);
    --clear-soft:     color-mix(in oklab, var(--clear-500) 15%, transparent);
    --clear-border:   color-mix(in oklab, var(--clear-500) 36%, transparent);

    --leak:           var(--leak-400);
    --leak-soft:      color-mix(in oklab, var(--leak-500) 16%, transparent);
    --leak-border:    color-mix(in oklab, var(--leak-500) 38%, transparent);

    --focus-ring:     var(--seal-400);
  }

  /* ============================================================
     TOKENS — spacing, radii, layout (4px grid)
     ============================================================ */
  :root {
    --space-0:  0;
    --space-1:  0.25rem;
    --space-2:  0.5rem;
    --space-3:  0.75rem;
    --space-4:  1rem;
    --space-5:  1.25rem;
    --space-6:  1.5rem;
    --space-8:  2rem;
    --space-10: 2.5rem;
    --space-12: 3rem;
    --space-16: 4rem;
    --space-20: 5rem;

    --radius-xs:   3px;
    --radius-sm:   5px;
    --radius-md:   8px;
    --radius-lg:   12px;
    --radius-xl:   16px;
    --radius-2xl:  22px;
    --radius-pill: 999px;

    --container-max: 1240px;
    --gutter:        var(--space-6);
    --topbar-h:      60px;

    --hairline: 1px;
  }

  /* ============================================================
     TOKENS — elevation & motion (light defaults; dark overrides)
     ============================================================ */
  :root {
    --shadow-xs:  0 1px 2px rgba(9, 12, 16, 0.06);
    --shadow-sm:  0 1px 3px rgba(9, 12, 16, 0.08), 0 1px 2px rgba(9, 12, 16, 0.04);
    --shadow-md:  0 4px 12px rgba(9, 12, 16, 0.08), 0 2px 4px rgba(9, 12, 16, 0.05);
    --shadow-lg:  0 12px 28px rgba(9, 12, 16, 0.12), 0 4px 10px rgba(9, 12, 16, 0.06);
    --shadow-xl:  0 24px 56px rgba(9, 12, 16, 0.16), 0 8px 20px rgba(9, 12, 16, 0.08);

    --glow-seal: 0 0 0 1px var(--accent-border), 0 0 24px -6px var(--seal-500);
    --ring: 0 0 0 3px color-mix(in oklab, var(--focus-ring) 35%, transparent);

    --ease-out:   cubic-bezier(0.22, 0.61, 0.36, 1);
    --ease-inout: cubic-bezier(0.45, 0, 0.2, 1);
    --dur-fast:   120ms;
    --dur-base:   180ms;
    --dur-slow:   280ms;
  }
  [data-theme="dark"] {
    --shadow-xs:  0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow-sm:  0 1px 3px rgba(0, 0, 0, 0.5), 0 1px 2px rgba(0, 0, 0, 0.3);
    --shadow-md:  0 6px 16px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.35);
    --shadow-lg:  0 16px 36px rgba(0, 0, 0, 0.55), 0 6px 14px rgba(0, 0, 0, 0.4);
    --shadow-xl:  0 28px 64px rgba(0, 0, 0, 0.6), 0 10px 24px rgba(0, 0, 0, 0.45);
  }

  /* ============================================================
     BASE ELEMENTS
     ============================================================ */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: var(--text-base);
    line-height: var(--leading-normal);
    color: var(--text-body);
    background: var(--bg-canvas);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-feature-settings: 'cv01', 'ss01';
  }
  h1, h2, h3, h4, h5, h6 {
    margin: 0;
    color: var(--text-strong);
    font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight);
    line-height: var(--leading-tight);
    text-wrap: balance;
  }
  p { margin: 0; text-wrap: pretty; }
  a {
    color: var(--accent);
    text-decoration: none;
    transition: color var(--dur-fast) var(--ease-out);
  }
  a:hover { color: var(--accent-hover); }
  code, pre, kbd, samp { font-family: var(--font-mono); font-size: 0.92em; }
  ::selection { background: color-mix(in oklab, var(--seal-500) 28%, transparent); }
  :focus-visible {
    outline: none;
    box-shadow: var(--ring);
    border-radius: var(--radius-sm);
  }
  hr {
    border: none;
    border-top: var(--hairline) solid var(--border-subtle);
    margin: var(--space-6) 0;
  }

  /* --- Reusable text helpers --- */
  .al-eyebrow {
    font-family: var(--font-mono);
    font-size: var(--text-2xs);
    letter-spacing: var(--tracking-caps);
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: var(--weight-medium);
    margin-bottom: 4px;
  }
  .al-mono { font-family: var(--font-mono); }
  .al-tabular { font-variant-numeric: tabular-nums; }
  .al-faint { color: var(--text-faint); }
  .al-right { text-align: right; }

  /* ============================================================
     COMPONENT CLASSES (from the design's components.css)
     ============================================================ */

  /* ---------- Button ---------- */
  .al-btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: var(--space-2);
    font-family: var(--font-sans); font-weight: var(--weight-medium);
    letter-spacing: var(--tracking-snug);
    border: 1px solid transparent; border-radius: var(--radius-md);
    cursor: pointer; white-space: nowrap;
    transition: background var(--dur-fast) var(--ease-out),
                border-color var(--dur-fast) var(--ease-out),
                color var(--dur-fast) var(--ease-out),
                transform var(--dur-fast) var(--ease-out);
    user-select: none;
  }
  .al-btn:focus-visible { outline: none; box-shadow: var(--ring); }
  .al-btn:active { transform: translateY(0.5px); }
  .al-btn[disabled], .al-btn[aria-disabled="true"] { opacity: 0.5; cursor: not-allowed; transform: none; }
  .al-btn--sm { font-size: var(--text-sm); padding: 6px 12px; height: 32px; }
  .al-btn--md { font-size: var(--text-base); padding: 8px 16px; height: 38px; }
  .al-btn--primary { background: var(--accent); color: var(--text-on-accent); }
  .al-btn--primary:hover:not([disabled]) { background: var(--accent-hover); }
  .al-btn--secondary { background: var(--surface-card); color: var(--text-strong); border-color: var(--border-default); }
  .al-btn--secondary:hover:not([disabled]) { border-color: var(--border-strong); background: var(--surface-inset); }
  .al-btn--ghost { background: transparent; color: var(--text-body); }
  .al-btn--ghost:hover:not([disabled]) { background: var(--surface-inset); color: var(--text-strong); }
  .al-btn__icon { display: inline-flex; width: 1em; height: 1em; }
  .al-btn__icon svg { width: 100%; height: 100%; }

  /* ---------- Icon button ---------- */
  .al-iconbtn {
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; color: var(--text-muted);
    border: 1px solid transparent; border-radius: var(--radius-md);
    cursor: pointer; padding: 0;
    transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
  }
  .al-iconbtn--md { width: 38px; height: 38px; }
  .al-iconbtn:hover { background: var(--surface-inset); color: var(--text-strong); }
  .al-iconbtn:focus-visible { outline: none; box-shadow: var(--ring); }
  .al-iconbtn svg { width: 1.05em; height: 1.05em; }
  .al-iconbtn--md svg { font-size: 18px; }
  .al-iconbtn.is-spinning svg { animation: al-spin var(--dur-slow) var(--ease-out); }
  @keyframes al-spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }

  /* ---------- Badge / status pill ---------- */
  .al-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--font-sans); font-size: var(--text-xs);
    font-weight: var(--weight-medium); line-height: 1;
    padding: 4px 9px; border-radius: var(--radius-pill);
    border: 1px solid transparent; white-space: nowrap;
  }
  .al-badge__dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .al-badge--neutral { background: var(--surface-inset); color: var(--text-muted); border-color: var(--border-subtle); }
  .al-badge--caught  { background: var(--caught-soft); color: var(--caught); border-color: var(--caught-border); }
  .al-badge--clear   { background: var(--clear-soft);  color: var(--clear);  border-color: var(--clear-border); }
  .al-badge--leak    { background: var(--leak-soft);   color: var(--leak);   border-color: var(--leak-border); }
  .al-badge--accent  { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-border); }

  /* ---------- Detector tag (mono token chip) ---------- */
  .al-detector {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--font-mono); font-size: var(--text-xs);
    font-weight: var(--weight-medium);
    padding: 3px 8px; border-radius: var(--radius-sm);
    background: var(--surface-inset); color: var(--text-body);
    border: 1px solid var(--border-subtle);
  }
  .al-detector__mark { width: 7px; height: 7px; border-radius: 2px; background: var(--caught-500); }

  /* ---------- Card ---------- */
  .al-card {
    background: var(--surface-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
  }
  .al-card--pad { padding: var(--space-5); }

  /* ---------- Metric stat ---------- */
  .al-metric { display: flex; flex-direction: column; gap: 6px; }
  .al-metric__label {
    font-family: var(--font-mono); font-size: var(--text-2xs);
    letter-spacing: var(--tracking-caps); text-transform: uppercase;
    color: var(--text-muted);
  }
  .al-metric__value {
    font-family: var(--font-mono); font-variant-numeric: tabular-nums;
    font-weight: var(--weight-medium); letter-spacing: -0.01em;
    color: var(--text-strong); line-height: 1; font-size: var(--text-3xl);
  }
  .al-metric__foot { display: flex; align-items: center; gap: 6px; font-size: var(--text-xs); color: var(--text-muted); }
  .al-metric__delta--up { color: var(--clear); }
  .al-metric__delta--down { color: var(--leak); }
  .al-metric--caught .al-metric__value { color: var(--caught); }
  .al-metric--clear  .al-metric__value { color: var(--clear); }
  .al-metric--accent .al-metric__value { color: var(--accent); }

  /* ---------- Tabs ---------- */
  .al-tabs { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface-inset); border-radius: var(--radius-md); border: 1px solid var(--border-subtle); }
  .al-tab {
    font-family: var(--font-sans); font-size: var(--text-sm); font-weight: var(--weight-medium);
    color: var(--text-muted); background: transparent; border: none; cursor: pointer;
    padding: 6px 14px; border-radius: var(--radius-sm);
    transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
  }
  .al-tab:hover { color: var(--text-strong); }
  .al-tab--active { background: var(--surface-card); color: var(--text-strong); box-shadow: var(--shadow-xs); }
  .al-tab:focus-visible { outline: none; box-shadow: var(--ring); }

  /* ============================================================
     DASHBOARD LAYOUT (from the design's dashboard.css)
     ============================================================ */
  .al-app { min-height: 100vh; background: var(--bg-canvas); color: var(--text-body); }

  /* ---- Top bar ---- */
  .al-topbar {
    display: flex; align-items: center; gap: var(--space-6);
    height: var(--topbar-h); padding: 0 var(--space-6);
    border-bottom: 1px solid var(--border-subtle);
    background: var(--bg-sunken);
    position: sticky; top: 0; z-index: 10;
  }
  .al-topbar__brand { display: flex; align-items: center; gap: var(--space-3); }
  .al-topbar__sep { width: 1px; height: 22px; background: var(--border-default); }
  .al-topbar__title { font-size: var(--text-base); font-weight: var(--weight-medium); color: var(--text-strong); }
  .al-topbar__status { display: flex; align-items: center; gap: var(--space-2); }
  .al-topbar__actions { display: flex; align-items: center; gap: var(--space-3); margin-left: auto; }

  /* ---- Page ---- */
  .al-page { max-width: 1180px; margin: 0 auto; padding: var(--space-8) var(--space-6) var(--space-16); }
  .al-page__head { margin-bottom: var(--space-6); }
  .al-page__h1 { font-size: var(--text-2xl); font-weight: var(--weight-semibold); }
  .al-page__sub { font-size: var(--text-sm); color: var(--text-muted); margin-top: 6px; max-width: 64ch; }

  /* ---- Headline metrics ---- */
  .al-headline { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-4); margin-bottom: var(--space-5); }
  .al-headline .al-card { padding: var(--space-5); display: flex; align-items: flex-start; gap: var(--space-4); }
  .al-headline__icon {
    flex: none; width: 44px; height: 44px; border-radius: var(--radius-md);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 22px;
    background: var(--surface-inset); color: var(--text-muted);
    border: 1px solid var(--border-subtle);
  }
  .al-headline__icon--caught { background: var(--caught-soft); color: var(--caught); border-color: var(--caught-border); }
  .al-headline__icon--accent { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-border); }
  .al-headline__icon--clear  { background: var(--clear-soft);  color: var(--clear);  border-color: var(--clear-border); }
  .al-headline .al-metric { flex: 1; }

  /* ---- Two-column grid (timeline + detectors) ---- */
  .al-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: var(--space-4); margin-bottom: var(--space-5); }

  /* ---- Panel ---- */
  .al-panel { padding: var(--space-5); }
  .al-panel__head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-5); }
  .al-panel__title { font-size: var(--text-md); font-weight: var(--weight-semibold); color: var(--text-strong); }

  /* ---- Legend ---- */
  .al-legend { display: flex; align-items: center; gap: var(--space-4); font-size: var(--text-xs); color: var(--text-muted); }
  .al-legend__item { display: inline-flex; align-items: center; gap: 6px; }
  .al-legend__item i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }

  /* ---- Caught-vs-clean chart (hand-rolled bars) ---- */
  .al-chart { display: flex; align-items: flex-end; gap: var(--space-3); height: 200px; padding-top: var(--space-2); }
  .al-chart__col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: var(--space-2); min-width: 0; }
  .al-chart__bar {
    width: 100%; max-width: 46px; min-height: 3px;
    background: var(--seal-500); border-radius: var(--radius-sm) var(--radius-sm) 2px 2px;
    position: relative; display: flex; flex-direction: column; justify-content: flex-start;
    overflow: hidden; transition: height var(--dur-slow) var(--ease-out);
  }
  .al-chart__caught { width: 100%; background: var(--caught-500); transition: height var(--dur-slow) var(--ease-out); }
  .al-chart__lbl { font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--text-faint); white-space: nowrap; }
  .al-chart__empty { display: flex; align-items: center; justify-content: center; height: 200px; color: var(--text-faint); font-size: var(--text-sm); text-align: center; }

  /* ---- Detector breakdown ---- */
  .al-detlist { display: flex; flex-direction: column; gap: var(--space-3); }
  .al-detrow { display: grid; grid-template-columns: 132px 1fr 48px; align-items: center; gap: var(--space-3); }
  .al-detrow__track { height: 8px; background: var(--surface-inset); border-radius: var(--radius-pill); overflow: hidden; }
  .al-detrow__fill { height: 100%; background: linear-gradient(90deg, var(--seal-600), var(--seal-400)); border-radius: var(--radius-pill); transition: width var(--dur-slow) var(--ease-out); }
  .al-detrow__count { font-size: var(--text-sm); color: var(--text-body); text-align: right; }

  /* ---- Table ---- */
  .al-table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
  .al-table th {
    text-align: left; font-family: var(--font-mono); font-size: var(--text-2xs);
    letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-faint);
    font-weight: var(--weight-medium); padding: 0 var(--space-3) var(--space-3); border-bottom: 1px solid var(--border-subtle);
  }
  .al-table td { padding: var(--space-3); border-bottom: 1px solid var(--border-subtle); vertical-align: middle; }
  .al-table tbody tr:last-child td { border-bottom: none; }
  .al-table tbody tr { transition: background var(--dur-fast) var(--ease-out); }
  .al-table tbody tr:hover { background: var(--surface-inset); }
  .al-detcell { display: flex; gap: 6px; flex-wrap: wrap; }
  .al-empty { padding: var(--space-8); text-align: center; color: var(--text-muted); }
  .al-empty__title { font-size: var(--text-md); color: var(--text-strong); margin-bottom: 6px; }

  /* ---- Endpoints ---- */
  .al-endpoints { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-4); }
  .al-code {
    margin: 0; padding: var(--space-4); border-radius: var(--radius-md);
    background: var(--surface-code); color: var(--text-on-code);
    font-family: var(--font-mono); font-size: var(--text-xs); line-height: var(--leading-relaxed);
    overflow: auto; white-space: pre; border: 1px solid var(--border-subtle);
  }
  .al-note { font-size: var(--text-sm); color: var(--text-muted); }
  .al-note + .al-note { margin-top: var(--space-3); }

  /* ---- Connection status ---- */
  .al-conn--ok   { color: var(--clear); }
  .al-conn--down { color: var(--leak); }

  /* ---- Responsive ---- */
  @media (max-width: 920px) {
    .al-headline { grid-template-columns: 1fr; }
    .al-grid { grid-template-columns: 1fr; }
    .al-endpoints { grid-template-columns: 1fr; }
    .al-topbar { flex-wrap: wrap; height: auto; padding: var(--space-3) var(--space-4); gap: var(--space-3); }
    .al-topbar__actions { width: 100%; flex-wrap: wrap; margin-left: 0; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script>
  /* ============================================================================
     Airlock dashboard — vanilla JS port of the design's parts.jsx.
     No framework. Builds the same DOM (same class names / structure) and wires
     it to the live GET /api/metrics endpoint.
     ============================================================================ */
  (function () {
    "use strict";

    // ---- tiny DOM builder -----------------------------------------------------
    function el(tag, attrs, children) {
      var node = document.createElement(tag);
      if (attrs) {
        for (var k in attrs) {
          if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
          var v = attrs[k];
          if (v == null || v === false) continue;
          if (k === "class") node.className = v;
          else if (k === "html") node.innerHTML = v;
          else if (k === "text") node.textContent = v;
          else if (k === "title") node.title = v;
          else if (k === "style") node.setAttribute("style", v);
          else if (k.slice(0, 2) === "on" && typeof v === "function") node.addEventListener(k.slice(2), v);
          else node.setAttribute(k, v);
        }
      }
      if (children != null) appendChildren(node, children);
      return node;
    }
    function appendChildren(node, children) {
      if (Array.isArray(children)) {
        children.forEach(function (c) { appendChildren(node, c); });
      } else if (children != null && children !== false) {
        node.appendChild(typeof children === "object" ? children : document.createTextNode(String(children)));
      }
    }
    function svg(inner, extraClass) {
      // Inline lucide-style icon (stroke 1.75). No namespace decl / URL — offline-safe.
      var wrap = el("span", { class: "al-btn__icon" + (extraClass ? " " + extraClass : "") });
      wrap.innerHTML =
        '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor"' +
        ' stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">' + inner + "</svg>";
      return wrap;
    }

    var ICON = {
      shield:  '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',
      refresh: '<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
      activity:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
      lock:    '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'
    };

    // ---- formatting helpers (mirror the design's data.js) ---------------------
    function fmt(n) {
      n = Number(n) || 0;
      return n.toLocaleString("en-US");
    }
    function ago(tsMs) {
      var s = Math.round((Date.now() - Number(tsMs)) / 1000);
      if (s < 0) s = 0;
      if (s < 60) return s + "s ago";
      var m = Math.round(s / 60);
      if (m < 60) return m + "m ago";
      var h = Math.round(m / 60);
      if (h < 24) return h + "h ago";
      return Math.round(h / 24) + "d ago";
    }
    function bytes(b) {
      b = Number(b) || 0;
      if (b < 1024) return b + " B";
      if (b < 1024 * 1024) return (b / 1024).toFixed(1) + " KB";
      return (b / 1024 / 1024).toFixed(1) + " MB";
    }
    function rid8(id) {
      return (id || "").replace(/-/g, "").slice(0, 8) || "--------";
    }

    // ---- reusable component builders (DS primitives) --------------------------
    function Badge(opts) {
      var tone = opts.tone || "neutral";
      var node = el("span", { class: "al-badge al-badge--" + tone });
      if (opts.dot) node.appendChild(el("span", { class: "al-badge__dot" }));
      appendChildren(node, opts.children != null ? opts.children : opts.label);
      return node;
    }
    function DetectorTag(kind) {
      return el("span", { class: "al-detector" }, [
        el("span", { class: "al-detector__mark" }),
        kind
      ]);
    }
    function Card(className, children) {
      return el("div", { class: "al-card" + (className ? " " + className : "") }, children);
    }
    function MetricStat(opts) {
      var cls = "al-metric" + (opts.tone ? " al-metric--" + opts.tone : "");
      var foot = [];
      if (opts.delta) {
        var up = String(opts.delta).indexOf("-") !== 0;
        foot.push(el("span", { class: "al-metric__delta--" + (up ? "up" : "down") }, opts.delta));
      }
      if (opts.foot) foot.push(el("span", { class: "al-faint" }, opts.foot));
      return el("div", { class: cls }, [
        el("div", { class: "al-metric__label" }, opts.label),
        el("div", { class: "al-metric__value" }, opts.value),
        foot.length ? el("div", { class: "al-metric__foot" }, foot) : null
      ]);
    }
    function Tabs(value, items, onChange) {
      return el("div", { class: "al-tabs", role: "tablist" }, items.map(function (it) {
        return el("button", {
          class: "al-tab" + (it.value === value ? " al-tab--active" : ""),
          type: "button",
          "aria-selected": it.value === value ? "true" : "false",
          onclick: function () { onChange(it.value); }
        }, it.label);
      }));
    }

    // ---- panel head helper ----------------------------------------------------
    function panelHead(eyebrow, title, right) {
      return el("div", { class: "al-panel__head" }, [
        el("div", null, [
          el("div", { class: "al-eyebrow" }, eyebrow),
          el("h3", { class: "al-panel__title" }, title)
        ]),
        right || null
      ]);
    }

    // ===========================================================================
    //  SECTIONS — each mirrors a component in the design's parts.jsx
    // ===========================================================================

    // Top bar: brand + status pills + (Overview/Endpoints) + range tab + refresh.
    function TopBar(state, actions) {
      var brand = el("div", { class: "al-topbar__brand" });
      // Inline wordmark SVG (brand). Mark circle + three dots + "Airlock".
      brand.innerHTML =
        '<svg width="150" height="30" viewBox="0 0 200 48" fill="none" role="img" aria-label="Airlock">' +
        '<circle cx="24" cy="24" r="18.25" stroke="#25c2b1" stroke-width="3.5"></circle>' +
        '<circle cx="15.5" cy="24" r="2.7" fill="#25c2b1"></circle>' +
        '<circle cx="24" cy="24" r="2.7" fill="#25c2b1"></circle>' +
        '<circle cx="32.5" cy="24" r="2.7" fill="#25c2b1"></circle>' +
        '<text x="56" y="32" font-family="var(--font-sans)" font-size="25" font-weight="600" letter-spacing="-0.5" fill="#eef2f5">Airlock</text>' +
        '</svg>';
      brand.appendChild(el("span", { class: "al-topbar__sep" }));
      brand.appendChild(el("span", { class: "al-topbar__title" }, "Dashboard"));

      var connTone = state.connected ? "clear" : "leak";
      var connText = state.connected ? "live" : "offline";
      var status = el("div", { class: "al-topbar__status" }, [
        Badge({ tone: "accent", dot: true, label: "127.0.0.1:8799" }),
        Badge({ tone: "neutral", label: "loopback" }),
        Badge({ tone: connTone, dot: true, label: connText })
      ]);

      var refreshBtn = el("button", {
        class: "al-iconbtn al-iconbtn--md", type: "button",
        "aria-label": "Refresh", title: "Refresh",
        onclick: function (e) {
          var b = e.currentTarget;
          b.classList.remove("is-spinning");
          void b.offsetWidth;
          b.classList.add("is-spinning");
          actions.onRefresh();
        }
      });
      refreshBtn.appendChild(svg(ICON.refresh).firstChild);

      var actionsRow = el("div", { class: "al-topbar__actions" }, [
        Tabs(state.view, [
          { value: "overview", label: "Overview" },
          { value: "endpoints", label: "Endpoints" }
        ], actions.onView),
        Tabs(state.range, [{ value: "all", label: "All-time" }], function () {}),
        refreshBtn
      ]);

      return el("header", { class: "al-topbar" }, [brand, status, actionsRow]);
    }

    // Headline: secrets blocked / requests protected / clean rate.
    function Headline(d) {
      var h = d.headline;
      var caughtIcon = el("div", { class: "al-headline__icon al-headline__icon--caught" });
      caughtIcon.innerHTML = '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">' + ICON.shield + "</svg>";
      var accentIcon = el("div", { class: "al-headline__icon al-headline__icon--accent" });
      accentIcon.innerHTML = '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">' + ICON.activity + "</svg>";
      var clearIcon = el("div", { class: "al-headline__icon al-headline__icon--clear" });
      clearIcon.innerHTML = '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">' + ICON.lock + "</svg>";

      return el("div", { class: "al-headline" }, [
        Card(null, [caughtIcon, MetricStat({
          label: "Secrets blocked", value: fmt(h.secretsBlocked), tone: "caught",
          foot: "all-time"
        })]),
        Card(null, [accentIcon, MetricStat({
          label: "Requests protected", value: fmt(h.requestsProtected), tone: "accent",
          foot: "all-time"
        })]),
        Card(null, [clearIcon, MetricStat({
          label: "Clean rate", value: h.cleanPct + "%", tone: "clear",
          foot: fmt(h.requestsClean) + " clean"
        })])
      ]);
    }

    // Timeline: caught vs clean, bucketed by hour from recent[].ts_ms.
    function Timeline(d) {
      var legend = el("div", { class: "al-legend" }, [
        el("span", { class: "al-legend__item" }, [
          el("i", { style: "background: var(--caught-500)" }), "caught"
        ]),
        el("span", { class: "al-legend__item" }, [
          el("i", { style: "background: var(--seal-500)" }), "clean"
        ])
      ]);
      var head = panelHead("Traffic", "Caught vs clean", legend);

      var body;
      if (!d.timeline.length) {
        body = el("div", { class: "al-chart__empty" }, "No recent requests to chart yet.");
      } else {
        var max = d.timeline.reduce(function (a, b) { return Math.max(a, b.caught + b.clean); }, 1);
        body = el("div", { class: "al-chart" }, d.timeline.map(function (b) {
          var total = b.caught + b.clean;
          var hPct = (total / max) * 100;
          var caughtPct = total ? (b.caught / total) * 100 : 0;
          var bar = el("div", {
            class: "al-chart__bar",
            style: "height: " + hPct + "%"
          }, [el("div", { class: "al-chart__caught", style: "height: " + caughtPct + "%" })]);
          return el("div", {
            class: "al-chart__col",
            title: fmt(b.caught) + " caught · " + fmt(b.clean) + " clean"
          }, [bar, el("span", { class: "al-chart__lbl" }, b.label)]);
        }));
      }
      return Card("al-panel", [head, body]);
    }

    // Detectors: horizontal bars by detector, sorted desc.
    function Detectors(d) {
      var top = d.byDetector.slice(0, 8);
      var head = panelHead("Breakdown", "Secrets by detector",
        Badge({ tone: "neutral", label: top.length + " kinds" }));
      var body;
      if (!top.length) {
        body = el("div", { class: "al-empty" }, [
          el("div", { class: "al-empty__title" }, "No detectors fired"),
          el("div", { class: "al-note" }, "Detector counts appear here once a secret is masked.")
        ]);
      } else {
        var max = top.reduce(function (a, x) { return Math.max(a, x.count); }, 1);
        body = el("div", { class: "al-detlist" }, top.map(function (row) {
          return el("div", { class: "al-detrow" }, [
            DetectorTag(row.kind),
            el("div", { class: "al-detrow__track" }, [
              el("div", { class: "al-detrow__fill", style: "width: " + (row.count / max) * 100 + "%" })
            ]),
            el("span", { class: "al-detrow__count al-tabular" }, fmt(row.count))
          ]);
        }));
      }
      return Card("al-panel", [head, body]);
    }

    // Recent requests table.
    function Recent(d) {
      var head = panelHead("Live", "Recent requests", Badge({ tone: "neutral", label: "value-free" }));
      var thead = el("thead", null, el("tr", null, [
        el("th", null, "Time"), el("th", null, "Request"), el("th", null, "Result"),
        el("th", null, "Detectors"), el("th", { class: "al-right" }, "Masked")
      ]));
      var rows;
      if (!d.recent.length) {
        rows = el("tr", null, el("td", { colspan: "5" }, el("div", { class: "al-empty" }, [
          el("div", { class: "al-empty__title" }, "No requests yet"),
          el("div", { class: "al-note" }, "Point Claude Code at Airlock to see live traffic.")
        ])));
      } else {
        rows = d.recent.map(function (r) {
          var result = r.masked > 0
            ? Badge({ tone: "caught", dot: true, label: r.masked + " masked" })
            : Badge({ tone: "clear", dot: true, label: "clean" });
          var detCell = el("div", { class: "al-detcell" },
            r.detectors.length
              ? r.detectors.map(function (k) { return DetectorTag(k); })
              : el("span", { class: "al-faint al-mono" }, "—"));
          return el("tr", null, [
            el("td", { class: "al-mono al-faint" }, ago(r.ts)),
            el("td", { class: "al-mono" }, r.reqId),
            el("td", null, result),
            el("td", null, detCell),
            el("td", { class: "al-right al-mono al-faint al-tabular" }, fmt(r.masked))
          ]);
        });
      }
      return Card("al-panel", [head, el("table", { class: "al-table" }, [thead, el("tbody", null, rows)])]);
    }

    // Bytes panel — replaces a synthetic figure with the real bytes_in/out totals.
    function Bytes(d) {
      var head = panelHead("Throughput", "Bytes processed", Badge({ tone: "accent", label: "all-time" }));
      var body = el("div", { class: "al-headline", style: "margin: 0; grid-template-columns: repeat(2, 1fr)" }, [
        Card(null, [MetricStat({ label: "Bytes in", value: bytes(d.bytesIn), tone: "accent", foot: fmt(d.bytesIn) + " B" })]),
        Card(null, [MetricStat({ label: "Bytes out", value: bytes(d.bytesOut), foot: fmt(d.bytesOut) + " B" })])
      ]);
      return Card("al-panel", [head, body]);
    }

    // Endpoints view — honest: shows the two real, live endpoints this UI exposes.
    function Endpoints(d) {
      var h = d.headline;
      var prom = [
        "# HELP airlock_requests_total Total requests proxied.",
        "# TYPE airlock_requests_total counter",
        "airlock_requests_total " + h.requestsProtected,
        "airlock_requests_with_secrets_total " + h.withSecrets,
        "airlock_requests_clean_total " + h.requestsClean,
        "# TYPE airlock_secrets_masked_total counter"
      ].concat(d.byDetector.slice(0, 5).map(function (x) {
        return 'airlock_secrets_masked_total{detector="' + x.kind + '"} ' + x.count;
      })).concat([
        "airlock_bytes_in_total " + d.bytesIn,
        "airlock_bytes_out_total " + d.bytesOut
      ]).join("\n");

      var json = JSON.stringify({
        requests_total: h.requestsProtected,
        requests_with_secrets: h.withSecrets,
        requests_clean: h.requestsClean,
        secrets_masked_total: h.secretsBlocked,
        by_detector: d.byDetector.slice(0, 6).reduce(function (a, x) { a[x.kind] = x.count; return a; }, {}),
        bytes_in_total: d.bytesIn,
        bytes_out_total: d.bytesOut
      }, null, 2);

      var promCard = Card("al-panel", [
        panelHead("Observability", "GET /metrics", Badge({ tone: "accent", label: "Prometheus" })),
        el("pre", { class: "al-code" }, prom)
      ]);
      var jsonCard = Card("al-panel", [
        panelHead("Web UI feed", "GET /api/metrics", Badge({ tone: "accent", label: "JSON" })),
        el("pre", { class: "al-code" }, json)
      ]);
      var noteCard = Card("al-panel", [
        panelHead("Scope", "All-time, value-free", Badge({ tone: "neutral", label: "honest" })),
        el("p", { class: "al-note" }, "Airlock's metrics are aggregated live from the value-free audit log and are cumulative (all-time). The proxy does not yet record per-endpoint counts or a time-series history, so this dashboard shows no per-route breakdown and labels every range as all-time — never fabricated history."),
        el("p", { class: "al-note" }, "The “Caught vs clean” chart is derived honestly by bucketing the recent requests feed by hour; when traffic is sparse it shows only the buckets that actually have data.")
      ]);

      return el("div", { class: "al-endpoints" }, [promCard, jsonCard, noteCard]);
    }

    // Empty / zero state.
    function EmptyState() {
      return Card("al-panel", [
        el("div", { class: "al-empty" }, [
          el("div", { class: "al-empty__title" }, "No traffic yet"),
          el("p", { class: "al-note" }, "Point Claude Code at Airlock (127.0.0.1:8799) and your secrets will be masked at the door. Counts, detector kinds and byte sizes appear here — never a secret value.")
        ])
      ]);
    }

    // ===========================================================================
    //  DATA — map the live /api/metrics payload into the shape the UI renders.
    //  The design's data.js is replaced entirely by this live mapping.
    // ===========================================================================
    function buildModel(m) {
      m = m || {};
      var total = Number(m.requests_total) || 0;
      var withSecrets = Number(m.requests_with_secrets) || 0;
      var clean = Number(m.requests_clean) || 0;
      var byDetObj = m.by_detector || {};

      var byDetector = Object.keys(byDetObj)
        .map(function (k) { return { kind: k, count: Number(byDetObj[k]) || 0 }; })
        .sort(function (a, b) { return b.count - a.count; });

      var recent = (Array.isArray(m.recent) ? m.recent : []).map(function (r) {
        return {
          ts: Number(r.ts_ms) || 0,
          reqId: rid8(r.request_id),
          masked: Number(r.masked) || 0,
          detectors: Array.isArray(r.detectors) ? r.detectors.slice() : []
        };
      });

      // Timeline: bucket recent[].ts_ms by hour into caught/clean counts. This is
      // the only honest time-series we can derive — the API has no history.
      var timeline = deriveTimeline(m.recent);

      var cleanPct = total > 0 ? ((clean / total) * 100).toFixed(1) : "0.0";

      return {
        empty: total === 0,
        headline: {
          secretsBlocked: Number(m.secrets_masked_total) || 0,
          requestsProtected: total,
          requestsClean: clean,
          cleanPct: cleanPct,
          withSecrets: withSecrets
        },
        timeline: timeline,
        byDetector: byDetector,
        recent: recent,
        bytesIn: Number(m.bytes_in_total) || 0,
        bytesOut: Number(m.bytes_out_total) || 0
      };
    }

    // Bucket the recent feed by clock-hour. Each bucket carries caught (masked>0)
    // vs clean (masked===0) counts. Returns oldest->newest, max ~12 buckets.
    function deriveTimeline(recent) {
      if (!Array.isArray(recent) || !recent.length) return [];
      var HOUR = 3600 * 1000;
      var buckets = {};
      recent.forEach(function (r) {
        var ts = Number(r.ts_ms) || 0;
        if (!ts) return;
        var key = Math.floor(ts / HOUR);
        if (!buckets[key]) buckets[key] = { key: key, caught: 0, clean: 0 };
        if ((Number(r.masked) || 0) > 0) buckets[key].caught += 1;
        else buckets[key].clean += 1;
      });
      var keys = Object.keys(buckets).map(Number).sort(function (a, b) { return a - b; });
      // Keep at most the 12 most-recent buckets so the chart stays readable.
      keys = keys.slice(-12);
      return keys.map(function (k) {
        var b = buckets[k];
        var dt = new Date(k * HOUR);
        var hh = ("0" + dt.getHours()).slice(-2);
        return { label: hh + ":00", caught: b.caught, clean: b.clean };
      });
    }

    // ===========================================================================
    //  APP SHELL — state + render + polling
    // ===========================================================================
    var ENDPOINT = "/api/metrics";
    var POLL_MS = 4000;

    var state = {
      view: "overview",
      range: "all",
      connected: false,
      model: buildModel(null)
    };

    function render() {
      var d = state.model;
      var main = el("main", { class: "al-page" }, [
        el("div", { class: "al-page__head" }, [
          el("h1", { class: "al-page__h1" }, "Secrets, caught at the door."),
          el("p", { class: "al-page__sub" },
            "Local, fully-offline metrics for the Airlock proxy — counts, detector kinds and byte sizes only. Never a secret value or body content.")
        ])
      ]);

      if (state.view === "overview") {
        if (d.empty) {
          main.appendChild(EmptyState());
        } else {
          main.appendChild(Headline(d));
          main.appendChild(el("div", { class: "al-grid" }, [Timeline(d), Detectors(d)]));
          main.appendChild(Recent(d));
          main.appendChild(el("div", { style: "margin-top: var(--space-5)" }, Bytes(d)));
        }
      } else {
        main.appendChild(Endpoints(d));
      }

      var app = el("div", { class: "al-app" }, [
        TopBar(state, {
          onView: function (v) { state.view = v; render(); },
          onRefresh: function () { poll(); }
        }),
        main
      ]);

      var root = document.getElementById("root");
      root.textContent = "";
      root.appendChild(app);
    }

    function poll() {
      fetch(ENDPOINT, { headers: { accept: "application/json" }, cache: "no-store" })
        .then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .then(function (json) {
          state.connected = true;
          state.model = buildModel(json);
          render();
        })
        .catch(function () {
          // Keep the last good model; just flip the connection badge to offline.
          state.connected = false;
          render();
        });
    }

    // Initial paint (empty model), first fetch, then poll every POLL_MS.
    render();
    poll();
    setInterval(poll, POLL_MS);
  })();
  </script>
</body>
</html>
